name: Repair 1.3.30 changelog

on:
  push:
    branches: [release/1.3.30]
    paths:
      - .github/workflows/release-1.3.30-changelog-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/1.3.30
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Prepend release notes to changelog
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const file = 'CHANGELOG.md'
          const current = fs.readFileSync(file, 'utf8')
          if (/^## 1\.3\.30\b/m.test(current)) process.exit(0)
          const marker = 'All notable changes to **OpenCode Goals** are documented here.\n\n'
          const section = `## 1.3.30 — 2026-08-25\n\nLong-Goal context-overflow and blank-session reliability release.\n\n- Exclude Goal control-plane persistence under \`.opencode/goals\`, \`.opencode/goal-locks\`, and \`.opencode/goal-sequences\` from host progress so internal state writes cannot defeat the no-progress guard.\n- Anchor the full Goal contract once per revision, use bounded reminders on repeated autonomous turns, and re-anchor once after compaction instead of re-appending huge objectives indefinitely.\n- Treat provider prompt/context overflow as deterministic context pressure rather than transient infrastructure: compact once under Goal ownership, then pause safely with explicit recovery guidance if overflow repeats before successful work.\n- Keep paused natural-language resume routing bounded for huge objectives, preserve multiline Goal bodies literally, and turn malformed pasted outer \`opencode run\` wrappers into visible non-mutating guidance instead of blank command failures.\n- Add regression coverage for the exact provider overflow shape, control-plane self-progress, ~30K-character contracts, bounded resume context, one-shot compaction recovery, repeated-overflow fail-safe behavior, and pasted command syntax.\n\n`
          if (!current.includes(marker)) throw new Error('CHANGELOG header marker not found')
          fs.writeFileSync(file, current.replace(marker, marker + section))
          NODE
      - name: Commit repaired changelog
        shell: bash
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md
          git commit -m "docs: add 1.3.30 changelog entry"
          git push origin HEAD:release/1.3.30
