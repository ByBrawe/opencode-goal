name: Apply Verifier Deadline Fix
on:
  push:
    branches: [fix-verifier-deadlines-20260814]
    paths:
      - scripts/apply-verifier-deadline-fix.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix-verifier-deadlines-20260814
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/apply-verifier-deadline-fix.mjs
      - run: npm run check
      - run: npm test
      - name: Commit verified fix
        uses: actions/github-script@v8
        with:
          script: |
            const { execFileSync } = require('node:child_process')
            execFileSync('git', ['config', 'user.name', 'github-actions[bot]'])
            execFileSync('git', ['config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'])
            execFileSync('git', ['add', 'src/opencode/verifier.ts', 'src/opencode/plugin.ts', 'test/verifier-timeout.test.mjs'])
            const status = execFileSync('git', ['status', '--porcelain'], { encoding: 'utf8' })
            if (!status.trim()) return
            execFileSync('git', ['commit', '-m', 'fix: give semantic verifier enough time'])
            execFileSync('git', ['push', 'origin', 'HEAD:fix-verifier-deadlines-20260814'])
