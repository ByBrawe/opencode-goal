name: Stage final 1.3.19 metadata

on:
  push:
    branches: [stage/1.3.19-final]
    paths:
      - ".github/workflows/stage-1.3.19-final.yml"

permissions:
  contents: write

jobs:
  stage:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: stage/1.3.19-final
          fetch-depth: 0
      - name: Build release metadata
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          pkg.version = '1.3.19'
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')

          let workflow = fs.readFileSync('.github/workflows/publish-npm.yml', 'utf8')
          workflow = workflow.replaceAll('1.3.18', '1.3.19')
          fs.writeFileSync('.github/workflows/publish-npm.yml', workflow)

          let changelog = fs.readFileSync('CHANGELOG.md', 'utf8')
          const marker = 'All notable changes to **OpenCode Goals** are documented here.\n\n'
          const section = [
            '## 1.3.19 — 2026-08-18',
            '',
            'Shell completion and Windows Goal storage reliability hotfix.',
            '',
            '- Count Goal-owned `bash` activity as host progress only when OpenCode reports a finite numeric process exit; timeout/abort or missing exit metadata remains no-progress, while ordinary nonzero exits still count as completed diagnostic work.',
            '- Retry transient Windows `EPERM`, `EACCES`, and `EBUSY` access/share denials for both canonical Goal process-lock owner reads and canonical lock-file `lstat()` safety inspection, using the same small bounded backoff window.',
            '- Preserve fail-closed semantics across these paths: shell hashing/deduplication/revision ownership and completion evidence stay unchanged, while `ENOENT`, malformed lock metadata, symlink/junction safety, CAS/lease ownership, POSIX behavior, and persistent Windows access failures keep their existing authority.',
            '- Add regressions proving three distinct timed-out shell turns still reach the normal stall pause; one transient Windows owner-read denial and one transient canonical-lock `lstat()` denial recover to normal `lock_timeout`; persistent denials still escape unchanged.',
            '',
          ].join('\n') + '\n'
          if (!changelog.startsWith('# Changelog\n\n' + marker)) throw new Error('unexpected CHANGELOG header')
          if (changelog.includes('## 1.3.19 — 2026-08-18')) throw new Error('1.3.19 section already exists on staging base')
          changelog = changelog.replace(marker, marker + section)
          fs.writeFileSync('CHANGELOG.md', changelog)
          NODE
      - name: Commit staged metadata and remove helper
        shell: bash
        run: |
          rm .github/workflows/stage-1.3.19-final.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json CHANGELOG.md .github/workflows/publish-npm.yml .github/workflows/stage-1.3.19-final.yml
          git commit -m "release: stage final 1.3.19 metadata"
          git push origin HEAD:stage/1.3.19-final
