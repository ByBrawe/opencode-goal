name: OpenCode 2 Unit Handoff

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/domain/goal.ts"
      - "src/domain/types.ts"
      - "src/opencode/command.ts"
      - "src/opencode/controls.ts"
      - "src/opencode2/**"
      - "src/persistence/store.ts"
      - "scripts/opencode2-unit-handoff-canary.mjs"
      - ".github/workflows/opencode2-unit-handoff.yml"

permissions:
  contents: read

jobs:
  three-unit-handoff:
    name: OpenCode 2.0.15 three-session unit handoff
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm install
      - run: npm run build
      - name: Install OpenCode 2.0.15
        run: npm install -g @opencode/cli@2.0.15
      - name: Check handoff canary syntax
        run: node --check scripts/opencode2-unit-handoff-canary.mjs
      - name: Prove three native sessions preserve one Goal
        run: node scripts/opencode2-unit-handoff-canary.mjs
