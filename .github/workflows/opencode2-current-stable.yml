name: Current OpenCode 2 Stable Host

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/opencode2/**"
      - "src/server.ts"
      - "src/install.ts"
      - "src/install-legacy.ts"
      - "scripts/opencode2-current-stable-canary.mjs"
      - ".github/workflows/opencode2-current-stable.yml"
      - "package.json"

permissions:
  contents: read

jobs:
  current-stable-v2:
    name: OpenCode 2.0.15 stable lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm install
      - run: npm run build
      - name: Install OpenCode 2.0.15
        run: npm install -g @opencode/cli@2.0.15
      - name: Check current stable canary syntax
        run: node --check scripts/opencode2-current-stable-canary.mjs
      - name: Prove default lifecycle and autonomous ownership
        run: node scripts/opencode2-current-stable-canary.mjs
