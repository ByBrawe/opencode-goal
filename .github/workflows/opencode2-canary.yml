name: Experimental OpenCode 2 Loader Probe

on:
  workflow_dispatch:
  push:
    branches: [fix-v2-local-plugin-discovery]
    paths:
      - "scripts/opencode2-loader-canary.mjs"
      - ".github/workflows/opencode2-canary.yml"

permissions:
  contents: read

jobs:
  plugin-loader:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm install -g @opencode-ai/cli@next
      - run: opencode2 --version
      - run: node scripts/opencode2-loader-canary.mjs
