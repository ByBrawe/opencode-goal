name: V2 source verification workspace
on:
  push:
    branches: [main]
    paths: [.github/workflows/v2-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: goal
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ByBrawe/opencode-loop
          ref: d3af7a5c426f96d5106e01951fc22d6872415108
          path: loop
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - name: Install development dependencies
        run: |
          (cd loop && npm ci)
          (cd goal && npm install)
      - name: Archive tracked public source and dependencies without Git metadata
        run: |
          mkdir -p workspace/loop workspace/goal workspace/tools
          git -C loop archive HEAD | tar -x -C workspace/loop
          git -C goal archive HEAD | tar -x -C workspace/goal
          mv loop/node_modules workspace/loop/node_modules
          mv goal/node_modules workspace/goal/node_modules
          cp "$(command -v bun)" workspace/tools/bun
          printf '%s\n' "loop=$(git -C loop rev-parse HEAD)" "goal=$(git -C goal rev-parse HEAD)" > workspace/source-refs.txt
          tar -czf v2-source-workspace.tar.gz -C workspace .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v2-source-workspace
          path: v2-source-workspace.tar.gz
          retention-days: 1
          if-no-files-found: error
