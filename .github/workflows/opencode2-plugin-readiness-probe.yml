name: Probe OpenCode 2 plugin readiness

on:
  pull_request:
    paths:
      - "scripts/opencode2-plugin-readiness-probe.mjs"
      - ".github/workflows/opencode2-plugin-readiness-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install current OpenCode 2 beta CLI
        run: npm install -g @opencode-ai/cli@next
      - run: opencode2 --version
      - name: Probe same-service project plugin readiness
        run: node scripts/opencode2-plugin-readiness-probe.mjs
