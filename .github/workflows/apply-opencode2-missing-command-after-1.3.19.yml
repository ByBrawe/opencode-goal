name: Apply focused OpenCode 2 missing-command guard

on:
  push:
    branches: [fix/opencode2-missing-command-after-1.3.19]
    paths:
      - .github/workflows/apply-opencode2-missing-command-after-1.3.19.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/opencode2-missing-command-after-1.3.19
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Apply minimal guard
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          const file = 'src/opencode2/experimental.ts'
          let text = fs.readFileSync(file, 'utf8')
          const before = `    await ctx.command.transform((commands) => {\n      commands.update("goal", (command: any) => {`
          const after = `    await ctx.command.transform((commands) => {\n      // OpenCode 2 command transforms may only update commands that already\n      // exist in the host registry. Project commands are sourced from config\n      // (for example .opencode/commands/goal.md); a plugin cannot add one here.\n      // Missing command transport must therefore disable only the /goal wrapper,\n      // not crash plugin setup and hide the otherwise valid tools/hooks.\n      if (typeof commands?.get !== "function" || !commands.get("goal")) return\n      commands.update("goal", (command: any) => {`
          if (!text.includes(before)) throw new Error('command transform block not found on current main')
          text = text.replace(before, after)
          fs.writeFileSync(file, text)
          NODE
          git diff --check
      - run: npm install
      - run: npm run check
      - run: npm run build
      - run: node --test test/opencode2-missing-command.test.mjs
      - name: Commit focused patch and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-opencode2-missing-command-after-1.3.19.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/opencode2/experimental.ts .github/workflows/apply-opencode2-missing-command-after-1.3.19.yml
          git commit -m "fix: tolerate missing V2 goal command during setup"
          git push origin HEAD:fix/opencode2-missing-command-after-1.3.19
