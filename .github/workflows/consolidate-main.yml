name: Consolidate reviewed Goal branches

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: consolidate-reviewed-goal-branches
  cancel-in-progress: false

jobs:
  archive-and-clean:
    if: github.repository == 'ByBrawe/opencode-goal' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Preserve reviewed heads before atomic lease-checked deletion
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { execFileSync } from 'node:child_process'
          import { appendFileSync, mkdtempSync, rmSync } from 'node:fs'
          import os from 'node:os'
          import path from 'node:path'

          function consolidate({ cwd = process.cwd(), snapshots, tag, keep = [] }) {
            const git = (args, options = {}) => execFileSync('git', args, {
              cwd, encoding: 'utf8', maxBuffer: 20_000_000, timeout: 60_000, ...options,
            }).trim()
            const heads = () => new Map(git(['ls-remote', '--heads', 'origin']).split('\n').filter(Boolean).map((line) => {
              const [sha, ref] = line.split(/\s+/)
              return [ref.replace(/^refs\/heads\//, ''), sha]
            }))
            const check = (current) => {
              assert.ok(current.has('main'), 'main is missing')
              for (const [name, sha] of current) {
                if (name === 'main') continue
                assert.equal(snapshots[name], sha, `Unexpected or changed branch: ${name}`)
              }
            }
            const initial = heads()
            check(initial)
            git(['fetch', '--no-tags', 'origin', '+refs/heads/*:refs/remotes/origin/*'])
            const main = initial.get('main')
            const entries = Object.entries(snapshots)
            const manifestPath = 'archive/branch-consolidation-2026-09-29.json'
            const tagRef = `refs/tags/${tag}`
            const published = git(['ls-remote', 'origin', tagRef])
            let archived
            if (published) {
              archived = published.split(/\s+/)[0]
              git(['fetch', '--no-tags', 'origin', archived])
              const saved = JSON.parse(git(['show', `${archived}:${manifestPath}`]))
              assert.deepEqual(saved.snapshots, snapshots, 'Existing archive belongs to a different branch snapshot')
            } else {
              const stats = entries.map(([name, sha]) => {
                try { git(['cat-file', '-e', `${sha}^{commit}`]) }
                catch { git(['fetch', '--no-tags', 'origin', sha]) }
                const [behind, ahead] = git(['rev-list', '--left-right', '--count', `${main}...${sha}`]).split(/\s+/).map(Number)
                return { name, sha, ahead, behind, files: git(['diff', '--name-status', main, sha]).split('\n').filter(Boolean) }
              })
              const manifest = JSON.stringify({
                purpose: 'Historical snapshots, not a merge of superseded code into main. Active V2 and handoff work is tracked through PRs #256 and #259. An open feature branch is retained until merged.',
                main, snapshots, stats,
              }, null, 2) + '\n'
              const temporary = mkdtempSync(path.join(os.tmpdir(), 'goal-branch-archive-'))
              try {
                const env = { ...process.env, GIT_INDEX_FILE: path.join(temporary, 'index') }
                git(['read-tree', main], { env })
                const blob = git(['hash-object', '-w', '--stdin'], { input: manifest })
                git(['update-index', '--add', '--cacheinfo', `100644,${blob},${manifestPath}`], { env })
                const tree = git(['write-tree'], { env })
                const parents = [...new Set([main, ...entries.map(([, sha]) => sha)])]
                archived = git(['commit-tree', tree, ...parents.flatMap((sha) => ['-p', sha])], {
                  input: 'archive: preserve every reviewed branch head before main-only consolidation\n',
                })
                git(['push', 'origin', `${archived}:${tagRef}`])
              } finally { rmSync(temporary, { recursive: true, force: true }) }
            }
            assert.equal(git(['ls-remote', 'origin', tagRef]).split(/\s+/)[0], archived, 'Archive was not persisted remotely')
            for (const [, sha] of entries) git(['merge-base', '--is-ancestor', sha, archived])
            const current = heads()
            check(current)
            const candidates = [...current].filter(([name]) => name !== 'main' && !keep.includes(name))
            if (candidates.length) git([
              'push', '--atomic',
              ...candidates.map(([name, sha]) => `--force-with-lease=refs/heads/${name}:${sha}`),
              'origin', ...candidates.map(([name]) => `:refs/heads/${name}`),
            ])
            const remaining = [...heads()]
            assert.deepEqual(remaining.map(([name]) => name).sort(), ['main', ...keep.filter((name) => current.has(name))].sort(), 'Unexpected branch remains')
            return { tag, archived, deleted: candidates.map(([name]) => name), remaining, mainAtStart: main }
          }

          const snapshots = {
            "archive/legacy-branches-2026-09-21": "51fdea4484684b487d578fa2cd7d58adea5f1b35",
            "feat/opencode2-direct-goal-lifecycle": "f4959ae520551fb5f79a8574885485ecbe2d23f4",
            "feat/opencode2-direct-goal-lifecycle-v2": "de0e52d7a6ecd20973d1e0e39cb196050d24ec4c",
            "feat/224-v2-host-limit-parity": "f122d04527112a697792f76a3c4f0c625952684b",
            "feat/224-v2-lifecycle-bridge": "a17f1bd03ebcc571cf2ca6f8862cd74ad19d9beb",
            "feat/224-v2-model-context-parity": "660e89ccd3f17dcaa0b358d8f25c5f80976c6f9b",
            "feat/224-v2-runtime-accounting": "ef33ab20a2a4239d1b74483f1d5d5ba3c7ab5cfd",
            "feat/224-v2-runtime-accounting-main": "1e0ba6130402f7ebfe7bb6360cf9b2046e7ee2bf",
            "feat/224-v2-semantic-completion": "6da588bfbe22acd4ecf343000441f0e6dd262822",
            "feat/224-v2-telemetry-parity": "1bd38b3ad20d9a2bcc49def2dc862c7c1d4cebba",
            "feat/224-v2-todo-fallback": "2a4f0cedb09d029507135e8da26a7ba9f24a7ecd",
            "feat/224-v2-todo-parity": "29e17e99ffa19339344b6f260bcd9fa491871469",
            "feat/228-v2-unit-handoff": "651ce8b664ce7e97a2848653bd9c464fa10601a8",
            "feat/228-v2-unit-handoff-main": "794ff2b953032d17a373072356129aa686eb9d0c",
            "feat/228-v2-unit-handoff-rebased": "c11b1b834a35ca2bdce846e9ca2b7fda9eaf785f",
            "fix/opencode2-preview-command-bridge": "db5f45e8e5a5710d53a9e53170d703632d835b59",
            "test/224-v2-current-todo-capability": "a903905856df60fe6c8e39ad43746f26eba4e737",
            "test/224-v2-model-limit-capabilities": "0300e5638357ca2b097b119a3ad6c9298a9d1891",
            "test/224-v2-telemetry-event-shape": "0728cd5c0e9a1f47f062cc1ebef5b74f7f774499",
            "test/224-v2-telemetry-gate": "c8e32b1b71a25bc99250328c3fbd6e7158446127"
          }

          const repository = 'ByBrawe/opencode-goal'
          assert.equal(process.env.GITHUB_REPOSITORY, repository)
          assert.equal(process.env.GITHUB_REF, 'refs/heads/main')
          assert.ok(process.env.GITHUB_TOKEN, 'Missing repository token')
          const api = async (route) => {
            const response = await fetch(`https://api.github.com/repos/${repository}${route}`, {
              headers: { authorization: `Bearer ${process.env.GITHUB_TOKEN}`, accept: 'application/vnd.github+json' },
              signal: AbortSignal.timeout(30_000),
            })
            assert.ok(response.ok, `Repository API ${route}: HTTP ${response.status}`)
            return await response.json()
          }
          assert.equal((await api('')).default_branch, 'main')
          const pr = await api('/pulls/259')
          assert.ok(pr.merged || pr.state === 'open', 'Unmerged closed PR requires manual review')
          assert.equal(pr.head.sha, '794ff2b953032d17a373072356129aa686eb9d0c')
          const keep = pr.merged ? [] : [pr.head.ref]
          if (pr.merged) execFileSync('git', ['merge-base', '--is-ancestor', pr.head.sha, 'HEAD'])
          for (let page = 1; ; page++) {
            assert.ok(page <= 10, 'Too many pull requests to validate safely')
            const pulls = await api(`/pulls?state=open&per_page=100&page=${page}`)
            assert.ok(Array.isArray(pulls))
            for (const pull of pulls) assert.ok(!(pull.head.repo?.full_name === repository && snapshots[pull.head.ref] && !(pull.number === 259 && keep.includes(pull.head.ref))), `Open PR #${pull.number} still owns a candidate branch`)
            if (pulls.length < 100) break
          }
          const result = consolidate({ snapshots, keep, tag: 'archive/branches-2026-09-29' })
          console.log(JSON.stringify(result, null, 2))
          if (process.env.GITHUB_STEP_SUMMARY) appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## Main-only consolidation\n\n```json\n' + JSON.stringify(result, null, 2) + '\n```\n')
          JS
