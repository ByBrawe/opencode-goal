name: Real OpenCode 2 Global Plugin Canary

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  opencode2-global-plugin-load:
    name: OpenCode 2 global plugin load (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install repository dependencies
        run: npm install
      - name: Build OpenCode Goals
        run: npm run build
      - name: Install current OpenCode 2 beta CLI
        env:
          GITHUB_TOKEN: ""
          NODE_AUTH_TOKEN: ""
        run: npm install -g @opencode-ai/cli@next
      - name: Show OpenCode 2 version
        run: opencode2 --version
      - name: Exercise documented global plugin discovery
        env:
          GITHUB_TOKEN: ""
          NODE_AUTH_TOKEN: ""
        run: node scripts/opencode2-global-canary.mjs
