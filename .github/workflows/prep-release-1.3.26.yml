name: One-shot prepare 1.3.26 release metadata

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'release/1.3.26-prep'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Update release metadata
        shell: bash
        run: |
          npm version 1.3.26 --no-git-tag-version
          node <<'NODE'
          const fs = require('fs')

          const changelogPath = 'CHANGELOG.md'
          let changelog = fs.readFileSync(changelogPath, 'utf8')
          const marker = '# Changelog\n\nAll notable changes to **OpenCode Goals** are documented here.\n\n'
          const section = `## 1.3.26 — 2026-08-22\n\nTransient infrastructure recovery release.\n\n- Persist bounded infrastructure-recovery state for semantic-verifier outages, provider retry, and continuation-dispatch transport failures, with exponential cooldown from 15 seconds up to a five-minute cap.\n- Keep OpenCode session ownership authoritative during provider retry/busy/unknown states so Goal never injects a duplicate autonomous prompt over a host-owned turn; add a bounded watchdog for older hosts that can remain in retry indefinitely.\n- Recover transient fetch/network/ECONNRESET/ENOTFOUND/EAI_AGAIN/ETIMEDOUT and retryable provider failures without converting a temporary outage into a permanent Goal pause or spending the three-turn no-progress budget.\n- Migrate narrowly matching legacy 1.3.25 semantic-verifier timeout pause/block states into automatic recovery while leaving real user pauses, project blockers, authentication failures, and semantic completion proof requirements fail-closed.\n- Harden restart and completion races so successful assistant completion cancels pending provider fallback before it can wake late, recovery timers survive persisted state safely, and status output explains infrastructure recovery instead of appearing stuck.\n\n`
          if (!changelog.includes('## 1.3.26 — 2026-08-22')) {
            if (!changelog.startsWith(marker)) throw new Error('unexpected CHANGELOG header')
            changelog = marker + section + changelog.slice(marker.length)
            fs.writeFileSync(changelogPath, changelog)
          }

          for (const file of ['.github/workflows/publish-npm.yml', 'RELEASING.md']) {
            let text = fs.readFileSync(file, 'utf8')
            text = text.replaceAll('1.3.25', '1.3.26').replaceAll('1.3.24', '1.3.25')
            fs.writeFileSync(file, text)
          }
          NODE
      - name: Verify release metadata
        shell: bash
        run: |
          test "$(node -p "require('./package.json').version")" = "1.3.26"
          grep -q '^## 1\.3\.26 — 2026-08-22$' CHANGELOG.md
          grep -q 'EXPECTED="1.3.26"' .github/workflows/publish-npm.yml
          grep -q 'PREVIOUS="1.3.25"' .github/workflows/publish-npm.yml
          grep -q '^1\.3\.26$' <(sed -n '/current one-shot stable guard is:/,/```/p' RELEASING.md | grep -E '^1\.3\.26$')
      - name: Commit generated release metadata
        shell: bash
        run: |
          if git diff --quiet -- package.json CHANGELOG.md RELEASING.md .github/workflows/publish-npm.yml; then
            echo "Release metadata already prepared."
            exit 0
          fi
          git add package.json CHANGELOG.md RELEASING.md .github/workflows/publish-npm.yml
          git config user.name "OpenCode Goal CI"
          git config user.email "opencode-goal-ci@example.invalid"
          git commit -m "release: prepare 1.3.26"
          git push origin HEAD:${{ github.head_ref }}
