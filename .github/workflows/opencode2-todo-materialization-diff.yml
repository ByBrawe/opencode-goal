name: OpenCode 2 Todo Materialization Diff

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/opencode2/**"
      - "src/server.ts"
      - "scripts/opencode2-todo-materialization-diff-canary.mjs"
      - ".github/workflows/opencode2-todo-materialization-diff.yml"

permissions:
  contents: read

jobs:
  compare-stock-and-goal:
    name: OpenCode 2.0.15 stock vs Goal Todo tools
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm install
      - run: npm run build
      - name: Install OpenCode 2.0.15
        run: npm install -g @opencode/cli@2.0.15
      - name: Check comparison canary syntax
        run: node --check scripts/opencode2-todo-materialization-diff-canary.mjs
      - name: Compare stock and Goal tool materialization
        run: node scripts/opencode2-todo-materialization-diff-canary.mjs
