name: Apply shell host progress fix

on:
  push:
    branches: [fix/shell-host-progress]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/shell-host-progress
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply focused patch
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')

          function replaceOnce(file, before, after) {
            let text = fs.readFileSync(file, 'utf8')
            if (!text.includes(before)) throw new Error(`pattern not found in ${file}: ${before.slice(0, 120)}`)
            text = text.replace(before, after)
            fs.writeFileSync(file, text)
          }

          const mutation = 'src/runtime/mutation-progress.ts'
          replaceOnce(
            mutation,
            `function asString(value: unknown): string | undefined {\n  return typeof value === "string" && value.trim() ? value.trim() : undefined\n}\n`,
            `function asString(value: unknown): string | undefined {\n  return typeof value === "string" && value.trim() ? value.trim() : undefined\n}\n\nexport function shellActivityFingerprint(args: any): MutationFingerprint | null {\n  const command = asString(args?.command)\n  if (!command) return null\n  const normalized = command.replace(/\\r\\n/g, "\\n").trim()\n  if (!normalized) return null\n  const sha256 = createHash("sha256").update(normalized).digest("hex")\n  return {\n    fingerprint: \`shell:\${sha256}\`,\n    summary: "Goal-owned shell command completed.",\n  }\n}\n`,
          )

          const plugin = 'src/opencode/plugin.ts'
          replaceOnce(
            plugin,
            `import { collectMutationFingerprints } from "../runtime/mutation-progress.js"`,
            `import { collectMutationFingerprints, shellActivityFingerprint } from "../runtime/mutation-progress.js"`,
          )
          replaceOnce(
            plugin,
            `      if (event.tool === SHELL_TOOL) {\n        await serialize(event.sessionID, async () => {\n          const goal = await load(event.sessionID)\n          if (goal?.status === "active" && requiresDistinctGoalTurnCadence(goal) && cadenceMutationReservations.has(event.sessionID)) {\n            throw new Error(CADENCE_BOUNDARY_MESSAGE)\n          }\n        })\n        return\n      }`,
            `      if (event.tool === SHELL_TOOL) {\n        await serialize(event.sessionID, async () => {\n          const goal = await load(event.sessionID)\n          if (goal?.status === "active" && requiresDistinctGoalTurnCadence(goal) && cadenceMutationReservations.has(event.sessionID)) {\n            throw new Error(CADENCE_BOUNDARY_MESSAGE)\n          }\n        })\n        ownership.rememberActiveTool(event.sessionID, event.callID, true)\n        return\n      }`,
          )
          replaceOnce(
            plugin,
            `      if (event.tool !== TODO_TOOL && !FILE_MUTATION_TOOLS.has(event.tool)) return`,
            `      if (event.tool !== TODO_TOOL && event.tool !== SHELL_TOOL && !FILE_MUTATION_TOOLS.has(event.tool)) return`,
          )
          replaceOnce(
            plugin,
            `      let madeProgress = false\n`,
            `      if (event.tool === SHELL_TOOL) {\n        const activity = shellActivityFingerprint(event.args)\n        if (!activity) return\n        await serialize(event.sessionID, async () => {\n          const goal = await load(event.sessionID)\n          if (!goal || goal.status !== "active" || !sameGoalTurn(call.owner, goalTurnOwner(goal))) return\n          const next = markHostProgress(goal, {\n            fingerprint: activity.fingerprint,\n            source: \`tool:\${event.tool}\`,\n            summary: activity.summary,\n          })\n          if (next !== goal) await save(next)\n        })\n        return\n      }\n\n      let madeProgress = false\n`,
          )

          const adapter = 'test/adapter.test.mjs'
          let testText = fs.readFileSync(adapter, 'utf8')
          const marker = 'test("goal-owned shell work counts as stable host progress"'
          if (!testText.includes(marker)) {
            testText += `\n\ntest("goal-owned shell work counts as stable host progress", async () => {\n  const root = await mkdtemp(path.join(os.tmpdir(), "opencode-goal-shell-progress-"))\n  try {\n    const fake = fakeClient()\n    const hooks = await OpenCodeGoalPlugin({ client: fake.client, directory: root })\n    const output = await createGoalThroughCommand(hooks)\n    await bindGoalTurn(hooks, output)\n\n    const before = await readOnlyGoal(root)\n    const command = "npm run quality"\n    await hooks["tool.execute.before"](\n      { tool: "bash", sessionID: "session-1", callID: "shell-1" },\n      { args: { command } },\n    )\n    await hooks["tool.execute.after"](\n      { tool: "bash", sessionID: "session-1", callID: "shell-1", args: { command } },\n      { title: "bash", output: "quality passed", metadata: {} },\n    )\n\n    let goal = await readOnlyGoal(root)\n    assert.equal(goal.progressRevision, before.progressRevision + 1)\n    assert.match(goal.progressNotes.at(-1).summary, /Goal-owned shell command completed/)\n    assert.doesNotMatch(goal.progressNotes.at(-1).summary, /npm run quality/)\n\n    await hooks["tool.execute.before"](\n      { tool: "bash", sessionID: "session-1", callID: "shell-2" },\n      { args: { command } },\n    )\n    await hooks["tool.execute.after"](\n      { tool: "bash", sessionID: "session-1", callID: "shell-2", args: { command } },\n      { title: "bash", output: "quality passed again", metadata: {} },\n    )\n    goal = await readOnlyGoal(root)\n    assert.equal(goal.progressRevision, before.progressRevision + 1, "repeating the same shell command must deduplicate")\n\n    const nextCommand = "npm run typecheck"\n    await hooks["tool.execute.before"](\n      { tool: "bash", sessionID: "session-1", callID: "shell-3" },\n      { args: { command: nextCommand } },\n    )\n    await hooks["tool.execute.after"](\n      { tool: "bash", sessionID: "session-1", callID: "shell-3", args: { command: nextCommand } },\n      { title: "bash", output: "typecheck passed", metadata: {} },\n    )\n    goal = await readOnlyGoal(root)\n    assert.equal(goal.progressRevision, before.progressRevision + 2, "a distinct Goal-owned shell action counts once")\n  } finally {\n    await rm(root, { recursive: true, force: true })\n  }\n})\n`
            fs.writeFileSync(adapter, testText)
          }
          NODE
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Commit tested patch and remove helper
        shell: bash
        run: |
          rm .github/workflows/apply-shell-progress-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/runtime/mutation-progress.ts src/opencode/plugin.ts test/adapter.test.mjs .github/workflows/apply-shell-progress-fix.yml
          git commit -m "fix: count goal-owned shell work as host progress"
          git push origin HEAD:fix/shell-host-progress
