name: Diagnose OpenCode 2 beta-17498 name.replace

on:
  push:
    branches: [diag/opencode2-beta17498-name-replace]
    paths:
      - .github/workflows/diag-opencode2-beta17498-name-replace.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: diag/opencode2-beta17498-name-replace
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Inspect exact beta package and installed host
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p beta17498-diagnostic/unpacked
          npm view @opencode-ai/cli@0.0.0-beta-17498 --json > beta17498-diagnostic/npm-view.json
          npm pack @opencode-ai/cli@0.0.0-beta-17498 --json > beta17498-diagnostic/npm-pack.json
          TARBALL="$(node -e "const x=require('./beta17498-diagnostic/npm-pack.json'); process.stdout.write(x[0].filename)")"
          tar -xzf "$TARBALL" -C beta17498-diagnostic/unpacked
          rm "$TARBALL"

          npm install -g @opencode-ai/cli@0.0.0-beta-17498
          opencode2 --version > beta17498-diagnostic/version.txt
          command -v opencode2 > beta17498-diagnostic/opencode2-path.txt
          readlink -f "$(command -v opencode2)" > beta17498-diagnostic/opencode2-realpath.txt || true
          npm root -g > beta17498-diagnostic/npm-root-global.txt

          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const cp = require('node:child_process')

          const outRoot = 'beta17498-diagnostic'
          const globalRoot = cp.execFileSync('npm', ['root', '-g'], { encoding: 'utf8' }).trim()
          const cliRoot = path.join(globalRoot, '@opencode-ai', 'cli')
          const bin = cp.execFileSync('which', ['opencode2'], { encoding: 'utf8' }).trim()
          let binReal = bin
          try { binReal = fs.realpathSync(bin) } catch {}

          const roots = [path.join(outRoot, 'unpacked', 'package'), cliRoot]
          const exact = [
            '_.name.replace',
            '.name.replace',
            'name.replace',
            'name?.replace',
          ]
          const hits = []
          const filesSeen = []

          function scanFile(file, label) {
            let stat
            try { stat = fs.statSync(file) } catch { return }
            if (!stat.isFile() || stat.size > 250 * 1024 * 1024) return
            let buf
            try { buf = fs.readFileSync(file) } catch { return }
            filesSeen.push({ label, file, bytes: buf.length })
            for (const needle of exact) {
              const n = Buffer.from(needle)
              let start = 0
              while (hits.length < 200) {
                const index = buf.indexOf(n, start)
                if (index < 0) break
                const from = Math.max(0, index - 500)
                const to = Math.min(buf.length, index + n.length + 500)
                const context = buf.subarray(from, to).toString('utf8')
                  .replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, '�')
                hits.push({ label, file, needle, index, context })
                start = index + n.length
              }
            }
          }

          function walk(root, label) {
            if (!fs.existsSync(root)) return
            const stack = [root]
            while (stack.length) {
              const current = stack.pop()
              let entries
              try { entries = fs.readdirSync(current, { withFileTypes: true }) } catch { continue }
              for (const entry of entries) {
                const full = path.join(current, entry.name)
                if (entry.isDirectory()) stack.push(full)
                else if (entry.isFile()) scanFile(full, label)
              }
            }
          }

          roots.forEach((root, i) => walk(root, i === 0 ? 'tarball' : 'global-install'))
          scanFile(binReal, 'opencode2-real-binary')

          const packageJson = JSON.parse(fs.readFileSync(path.join(cliRoot, 'package.json'), 'utf8'))
          fs.writeFileSync(path.join(outRoot, 'scan.json'), JSON.stringify({
            version: cp.execFileSync('opencode2', ['--version'], { encoding: 'utf8' }).trim(),
            cliRoot,
            bin,
            binReal,
            package: {
              name: packageJson.name,
              version: packageJson.version,
              repository: packageJson.repository ?? null,
              gitHead: packageJson.gitHead ?? null,
              dependencies: packageJson.dependencies ?? {},
              optionalDependencies: packageJson.optionalDependencies ?? {},
            },
            searchedNeedles: exact,
            filesScanned: filesSeen.length,
            hits,
          }, null, 2) + '\n')
          NODE

          find beta17498-diagnostic/unpacked/package -maxdepth 3 -type f | sort > beta17498-diagnostic/tarball-files.txt

      - name: Persist diagnostic evidence
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/diag-opencode2-beta17498-name-replace.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add beta17498-diagnostic .github/workflows/diag-opencode2-beta17498-name-replace.yml
          git commit -m "test: record beta-17498 name.replace diagnostic"
          git push origin HEAD:diag/opencode2-beta17498-name-replace
