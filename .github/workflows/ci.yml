name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm install
      - run: npm run check
      - run: npm test
      - run: bun -e "await import('./dist/index.js')"
      - run: npm run pack:check

  opencode-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin-version: ["1.4.0", "latest"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm install
      - run: npm install --no-save --package-lock=false "@opencode-ai/plugin@${{ matrix.plugin-version }}"
      - run: node -e "console.log(require('./node_modules/@opencode-ai/plugin/package.json').version)"
      - run: npm run check
      - run: npm test
      - run: bun -e "await import('./dist/index.js')"

  real-opencode-canary:
    name: real OpenCode lifecycle (${{ matrix.os }})
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm install
      - run: npm run build
      - name: Install current OpenCode CLI
        run: npm install --no-save --package-lock=false opencode-ai@latest
      - name: Show OpenCode version
        run: npx --no-install opencode --version
      - name: Probe clean OpenCode instance bootstrap
        run: node scripts/host-bootstrap-probe.mjs
        env:
          OPENCODE_PRINT_LOGS: "1"
          OPENCODE_LOG_LEVEL: DEBUG
      - name: Run real-host lifecycle canary
        run: npm run canary:host
        env:
          OPENCODE_PRINT_LOGS: "1"
          OPENCODE_LOG_LEVEL: DEBUG

  real-opencode-semantic-canary:
    name: real OpenCode semantic completion (${{ matrix.os }})
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm install
      - run: npm run build
      - name: Install current OpenCode CLI
        run: npm install --no-save --package-lock=false opencode-ai@latest
      - name: Show OpenCode version
        run: npx --no-install opencode --version
      - name: Probe clean OpenCode instance bootstrap
        run: node scripts/host-bootstrap-probe.mjs
        env:
          OPENCODE_PRINT_LOGS: "1"
          OPENCODE_LOG_LEVEL: DEBUG
      - name: Run real-host semantic completion canary
        run: npm run canary:semantic
        env:
          OPENCODE_PRINT_LOGS: "1"
          OPENCODE_LOG_LEVEL: DEBUG

  pr4-provider-patch:
    if: github.head_ref == 'ci/semantic-completion-canary' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ci/semantic-completion-canary
      - name: Patch verifier detection and remove temporary workflow
        shell: python
        run: |
          import re
          from pathlib import Path

          path = Path("scripts/host-semantic-canary.mjs")
          text = path.read_text()
          pattern = r'(?m)^    if \(tools\.has\("opencode_goal_verifier_result"\)\) \{\n      const request = extractAuditRequest\(text\)\n'
          replacement = '    const isVerifierAudit = text.includes("Verification request:") && /"auditToken"\\s*:/.test(text)\n    if (isVerifierAudit) {\n      if (!tools.has("opencode_goal_verifier_result")) throw new Error("verifier audit is missing opencode_goal_verifier_result")\n      const request = extractAuditRequest(text)\n'
          text, count = re.subn(pattern, lambda _match: replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"expected one verifier detection block, patched {count}")
          path.write_text(text)
          temporary = Path(".github/workflows/pr4-provider-patch.yml")
          if temporary.exists():
              temporary.unlink()
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/host-semantic-canary.mjs .github/workflows/pr4-provider-patch.yml
          git commit -m "ci: detect verifier requests by audit prompt"
          git push origin HEAD:ci/semantic-completion-canary
