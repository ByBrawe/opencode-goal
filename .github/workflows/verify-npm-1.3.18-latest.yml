name: Verify npm 1.3.18 latest

on:
  pull_request:
    paths:
      - ".github/workflows/verify-npm-1.3.18-latest.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Verify npm 1.3.18 latest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify version, latest tag, bin, and clean installer
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="1.3.18"
          VERSION="$(npm view "@bybrawe/opencode-goal@$EXPECTED" version --registry=https://registry.npmjs.org)"
          LATEST="$(npm view "@bybrawe/opencode-goal@latest" version --registry=https://registry.npmjs.org)"
          BIN="$(npm view "@bybrawe/opencode-goal@$EXPECTED" bin.opencode-goal --registry=https://registry.npmjs.org)"
          echo "version=$VERSION"
          echo "latest=$LATEST"
          echo "bin=$BIN"
          test "$VERSION" = "$EXPECTED"
          test "$LATEST" = "$EXPECTED"
          test "$BIN" = "bin/opencode-goal.js" -o "$BIN" = "./bin/opencode-goal.js"

          VERIFY_DIR="$(mktemp -d)"
          trap 'rm -rf "$VERIFY_DIR"' EXIT
          cd "$VERIFY_DIR"
          INSTALLED="$(npm exec --yes --package="@bybrawe/opencode-goal@$EXPECTED" -- opencode-goal --version)"
          echo "installer=$INSTALLED"
          test "$INSTALLED" = "$EXPECTED"
