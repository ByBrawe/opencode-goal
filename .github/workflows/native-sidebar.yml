name: Native Goal Sidebar
on:
  push:
    branches: [main]
  pull_request:
    paths: ['src/**', 'test/**', 'scripts/**', 'package.json', '.github/workflows/native-sidebar.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-sidebar-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  render:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - run: npm install
      - run: npm run check
      - run: npm run build
      - run: node --test test/tui-native-status.test.mjs
      - run: npm run test:tui-native
      - name: Native RPC on real OpenCode 2.0.18
        if: runner.os == 'Linux'
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/native-host" --package-lock=false @opencode/cli@2.0.18
          OPENCODE2_BINARY="$RUNNER_TEMP/native-host/node_modules/.bin/opencode2" node scripts/native-status-host-canary.mjs
