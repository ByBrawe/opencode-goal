name: Real Host Progress

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  progress:
    name: Host progress (${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm install
      - run: npm run build
      - name: Install current OpenCode CLI
        run: npm install --no-save --package-lock=false opencode-ai@latest
      - name: Show OpenCode version
        run: npx --no-install opencode --version
      - name: Probe clean OpenCode instance bootstrap
        run: node scripts/host-bootstrap-probe.mjs
        env:
          OPENCODE_PRINT_LOGS: "1"
          OPENCODE_LOG_LEVEL: DEBUG
      - name: Run real host mutation/no-op progress canary
        id: canary
        shell: bash
        run: |
          set +e
          npm run canary:progress > progress-canary.log 2>&1
          code=$?
          cat progress-canary.log
          exit $code
        env:
          OPENCODE_PRINT_LOGS: "1"
          OPENCODE_LOG_LEVEL: DEBUG
          OPENCODE_CONFIG_CONTENT: '{"permission":{"external_directory":"allow"}}'
      - name: Run real host shell progress canary
        id: shell-canary
        shell: bash
        run: |
          set +e
          node --import ./scripts/host-canary-bootstrap.mjs scripts/host-shell-progress-canary.mjs > shell-progress-canary.log 2>&1
          code=$?
          cat shell-progress-canary.log
          exit $code
        env:
          OPENCODE_PRINT_LOGS: "1"
          OPENCODE_LOG_LEVEL: DEBUG
          OPENCODE_CONFIG_CONTENT: '{"permission":{"external_directory":"allow"}}'
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: progress-canary-${{ matrix.os }}
          path: |
            progress-canary.log
            shell-progress-canary.log
          if-no-files-found: error
