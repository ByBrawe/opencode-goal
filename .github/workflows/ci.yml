name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm install
      - run: npm run check
      - run: npm test
      - run: bun -e "await import('./dist/index.js')"
      - run: npm run pack:check

  opencode-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin-version: ["1.4.0", "latest"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm install
      - run: npm install --no-save --package-lock=false "@opencode-ai/plugin@${{ matrix.plugin-version }}"
      - run: node -e "console.log(require('./node_modules/@opencode-ai/plugin/package.json').version)"
      - run: npm run check
      - run: npm test
      - run: bun -e "await import('./dist/index.js')"
