name: OpenCode 2 Unit Handoff

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/domain/goal.ts"
      - "src/domain/types.ts"
      - "src/opencode/command.ts"
      - "src/opencode/controls.ts"
      - "src/opencode2/**"
      - "src/persistence/store.ts"
      - "scripts/opencode2-unit-handoff-canary.mjs"
      - ".github/workflows/opencode2-unit-handoff.yml"
      - "package.json"

permissions:
  contents: read

jobs:
  three-unit-handoff:
    name: OpenCode ${{ matrix.host }} three-session unit handoff
    strategy:
      fail-fast: false
      matrix:
        host: ['2.0.16', '2.0.18']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm install
      - run: npm run build
      - name: Install pinned OpenCode 2 host
        env:
          HOST_VERSION: ${{ matrix.host }}
        run: npm install -g "@opencode/cli@$HOST_VERSION"
      - name: Verify exact host binary
        env:
          HOST_VERSION: ${{ matrix.host }}
        run: |
          ACTUAL=$(opencode2 --version)
          echo "$ACTUAL"
          test "$ACTUAL" = "opencode v$HOST_VERSION"
      - name: Check handoff canary syntax
        run: node --check scripts/opencode2-unit-handoff-canary.mjs
      - name: Prove three native sessions preserve one Goal
        run: node scripts/opencode2-unit-handoff-canary.mjs
