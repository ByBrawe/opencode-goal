name: Verify published Goal 1.3.26

on:
  pull_request:
    paths:
      - .github/workflows/verify-npm-1.3.26.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Verify exact version, latest tag, bin, and clean consumer
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="1.3.26"
          VERSION=""
          LATEST=""
          BIN=""
          for attempt in $(seq 1 36); do
            VERSION="$(npm view "@bybrawe/opencode-goal@$EXPECTED" version --registry=https://registry.npmjs.org 2>/dev/null || true)"
            LATEST="$(npm view "@bybrawe/opencode-goal@latest" version --registry=https://registry.npmjs.org 2>/dev/null || true)"
            BIN="$(npm view "@bybrawe/opencode-goal@$EXPECTED" bin.opencode-goal --registry=https://registry.npmjs.org 2>/dev/null || true)"
            echo "attempt=$attempt exact=$VERSION latest=$LATEST bin=$BIN"
            if [ "$VERSION" = "$EXPECTED" ] && [ "$LATEST" = "$EXPECTED" ] && { [ "$BIN" = "bin/opencode-goal.js" ] || [ "$BIN" = "./bin/opencode-goal.js" ]; }; then
              break
            fi
            sleep 5
          done
          test "$VERSION" = "$EXPECTED"
          test "$LATEST" = "$EXPECTED"
          if [ "$BIN" != "bin/opencode-goal.js" ] && [ "$BIN" != "./bin/opencode-goal.js" ]; then
            echo "unexpected bin: $BIN"
            exit 1
          fi

          VERIFY_DIR="$(mktemp -d)"
          trap 'rm -rf "$VERIFY_DIR"' EXIT
          cd "$VERIFY_DIR"
          INSTALLED_VERSION="$(npm exec --yes --package="@bybrawe/opencode-goal@$EXPECTED" -- opencode-goal --version)"
          echo "clean_consumer_version=$INSTALLED_VERSION"
          test "$INSTALLED_VERSION" = "$EXPECTED"
