name: Verify native entry isolation
on:
  push:
    branches: [main]
    paths: [.github/workflows/v2-native-entry-migration.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v2-native-entry-migration
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'ByBrawe/opencode-goal' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: goal
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: goal
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ByBrawe/opencode-loop
          ref: d3af7a5c426f96d5106e01951fc22d6872415108
          path: entry-migration
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: node scripts/actions-security-gate.mjs
      - run: npm install
      - run: npm run build
      - name: Reproduce eager V1 loading and isolate native entries and evidence
        run: node ../entry-migration/.github/scripts/migrate-native-entry.mjs
      - run: npm run check
      - run: npm test
      - run: npm run eval
      - run: npm run package:smoke
      - name: Exact native OpenCode host and three-session handoff
        if: runner.os == 'Linux'
        run: |
          npm install -g @opencode/cli@2.0.18
          test "$(opencode2 --version)" = 'opencode v2.0.18'
          node scripts/opencode2-unit-handoff-canary.mjs
      - name: Export tested source patch without repository write access
        if: runner.os == 'Linux'
        run: |
          git add -N src scripts test docs package.json
          git diff --check
          git diff --binary > "$RUNNER_TEMP/native-entry.patch"
          git add src scripts test docs package.json
          git diff --cached --raw --no-abbrev
          git diff --cached --numstat
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: runner.os == 'Linux'
        with:
          name: native-entry-verified-patch
          path: ${{ runner.temp }}/native-entry.patch
          if-no-files-found: error
          retention-days: 1
