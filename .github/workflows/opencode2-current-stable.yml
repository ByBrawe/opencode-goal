name: Current OpenCode 2 Stable Host

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - "src/opencode2/**"
      - "src/server.ts"
      - "src/install.ts"
      - "src/install-legacy.ts"
      - "scripts/opencode2-current-stable-canary.mjs"
      - "scripts/opencode2-direct-lifecycle-canary.mjs"
      - ".github/workflows/opencode2-current-stable.yml"
      - "package.json"

permissions:
  contents: read

jobs:
  current-stable-v2:
    name: Pinned OpenCode 2.0.16 legacy compatibility lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm install
      - run: npm run build
      - name: Install OpenCode 2.0.16
        run: npm install -g @opencode/cli@2.0.16
      - name: Check current stable canary syntax
        run: node --check scripts/opencode2-current-stable-canary.mjs
      - name: Prove default lifecycle and autonomous ownership
        run: node scripts/opencode2-current-stable-canary.mjs

  latest-v2:
    name: Latest OpenCode 2 waiting-user lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm install
      - run: npm run build
      - name: Install latest OpenCode 2
        run: npm install -g @opencode/cli@latest
      - name: Show latest OpenCode version
        run: opencode2 --version
      - name: Check current stable canary syntax
        run: node --check scripts/opencode2-current-stable-canary.mjs
      - name: Prove waiting-user resume on latest OpenCode 2
        env:
          OPENCODE2_EXPECTED_VERSION: "2."
        run: node scripts/opencode2-current-stable-canary.mjs

  latest-v2-direct-lifecycle:
    name: Latest OpenCode 2 direct lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm install
      - run: npm run build
      - name: Install latest OpenCode 2
        run: npm install -g @opencode/cli@latest
      - name: Show latest OpenCode version
        run: opencode2 --version
      - name: Check direct lifecycle canary syntax
        run: node --check scripts/opencode2-direct-lifecycle-canary.mjs
      - name: Prove pause resume edit clear and re-arming on a restarted old session
        env:
          OPENCODE2_EXPECTED_VERSION: "2."
          OPENCODE2_REARM_SAME_SESSION_CANARY: "1"
        run: node scripts/opencode2-direct-lifecycle-canary.mjs

  pinned-v2-1-4-real-native:
    name: Pinned OpenCode 2.1.4 real Goal lifecycle and restart
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install repository dependencies and build native plugin
        run: |
          # Goal does not commit package-lock.json; npm ci is invalid here.
          npm install
          npm run build
      - name: Install exact 2.1.4 host and print version evidence
        run: |
          npm install -g @opencode/cli@2.1.4
          opencode2 --version
          node -e 'const p=require("./package.json"); console.log("Goal", p.version, "native SDK", p.dependencies["@opencode/plugin"]);'
          opencode2 --version | grep -F "2.1.4"
      - name: Test V2 Goal host contract, waiting-user and ownership
        env:
          OPENCODE2_EXPECTED_VERSION: "2.1.4"
        run: node scripts/opencode2-current-stable-canary.mjs
      - name: Test explicit native lifecycle and same-session re-arm after restart
        env:
          OPENCODE2_EXPECTED_VERSION: "2.1.4"
          OPENCODE2_REARM_SAME_SESSION_CANARY: "1"
        run: node scripts/opencode2-direct-lifecycle-canary.mjs
