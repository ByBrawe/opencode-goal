name: Verify npm 1.3.18 registry

on:
  pull_request:
    paths:
      - .github/workflows/verify-npm-1.3.18.yml

permissions:
  contents: read

jobs:
  verify:
    name: Registry and clean installer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Verify 1.3.18 is settled as npm latest
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='@bybrawe/opencode-goal'
          EXPECTED='1.3.18'
          VERSION="$(npm view "$PACKAGE@$EXPECTED" version --registry=https://registry.npmjs.org)"
          LATEST="$(npm view "$PACKAGE" dist-tags.latest --registry=https://registry.npmjs.org)"
          BIN="$(npm view "$PACKAGE@$EXPECTED" bin.opencode-goal --registry=https://registry.npmjs.org)"
          echo "version=$VERSION latest=$LATEST bin=$BIN"
          test "$VERSION" = "$EXPECTED"
          test "$LATEST" = "$EXPECTED"
          test "$BIN" = 'bin/opencode-goal.js' || test "$BIN" = './bin/opencode-goal.js'

          VERIFY_DIR="$(mktemp -d)"
          trap 'rm -rf "$VERIFY_DIR"' EXIT
          cd "$VERIFY_DIR"
          INSTALLED_VERSION="$(npm exec --yes --package="$PACKAGE@$EXPECTED" -- opencode-goal --version)"
          echo "clean installer version=$INSTALLED_VERSION"
          test "$INSTALLED_VERSION" = "$EXPECTED"
