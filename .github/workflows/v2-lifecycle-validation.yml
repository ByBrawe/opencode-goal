name: V2 lifecycle candidate

on:
  push:
    paths: ['.github/workflows/v2-lifecycle-validation.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install
      - name: Load immutable candidate recipe
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs'
          const r = await fetch('https://api.github.com/repos/ByBrawe/opencode-goal/git/blobs/fbc2428686ebe91a12fb7e2762faaeaf40db32fa', { headers: { Authorization: `Bearer ${process.env.GH_TOKEN}` } })
          if (!r.ok) throw new Error(`recipe HTTP ${r.status}`)
          const blob = await r.json()
          writeFileSync(`${process.env.RUNNER_TEMP}/v2-candidate.py`, Buffer.from(blob.content, 'base64'))
          JS
      - name: Reproduce regressions before applying the correction
        shell: bash
        run: |
          python "$RUNNER_TEMP/v2-candidate.py" tests
          node --check test/opencode2-setup-cleanup.test.mjs
          npm run build
          if node --test test/opencode2-setup-cleanup.test.mjs > "$RUNNER_TEMP/baseline.log" 2>&1; then
            cat "$RUNNER_TEMP/baseline.log"
            echo 'Regression unexpectedly passed on the original source'
            exit 1
          fi
          cat "$RUNNER_TEMP/baseline.log"
          grep -q 'failed native command registration' "$RUNNER_TEMP/baseline.log"
          grep -q 'failed native tool registration' "$RUNNER_TEMP/baseline.log"
          python "$RUNNER_TEMP/v2-candidate.py" fix
      - name: Validate corrected source and complete regression suites
        shell: bash
        run: |
          npm run check
          npm test
          npm run eval
          npm run package:smoke
          git diff --check
      - name: Store verified source blobs without updating any branch
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs'
          import { createHash } from 'node:crypto'
          for (const path of ['src/opencode2/experimental.ts', 'test/opencode2-setup-cleanup.test.mjs', 'docs/OPENCODE2-MIGRATION.md']) {
            const data = readFileSync(path)
            const expected = createHash('sha1').update(`blob ${data.length}\0`).update(data).digest('hex')
            const r = await fetch('https://api.github.com/repos/ByBrawe/opencode-goal/git/blobs', { method: 'POST', headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ content: data.toString('base64'), encoding: 'base64' }) })
            if (!r.ok) throw new Error(`blob HTTP ${r.status}`)
            const blob = await r.json()
            if (blob.sha !== expected) throw new Error('verified source digest mismatch')
            console.log(`VERIFIED_FILE ${path} ${blob.sha}`)
          }
          console.log('No branch or commit was modified by this job.')
          JS
