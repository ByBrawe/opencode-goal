name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm install
      - run: npm run check
      - run: npm test
      - name: Run adversarial eval corpus
        run: npm run eval -- --json eval-report.json
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-corpus-${{ matrix.os }}
          path: eval-report.json
          if-no-files-found: error
      - run: bun -e "await import('./dist/index.js')"
      - run: npm run pack:check

  opencode-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin-version: ["1.4.0", "latest"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm install
      - run: npm install --no-save --package-lock=false "@opencode-ai/plugin@${{ matrix.plugin-version }}"
      - run: node -e "console.log(require('./node_modules/@opencode-ai/plugin/package.json').version)"
      - run: npm run check
      - run: npm test
      - run: bun -e "await import('./dist/index.js')"

  real-opencode-canary:
    name: real OpenCode lifecycle (${{ matrix.os }})
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm install
      - run: npm run build
      - name: Install current OpenCode CLI
        run: npm install --no-save --package-lock=false opencode-ai@latest
      - name: Show OpenCode version
        run: npx --no-install opencode --version
      - name: Probe clean OpenCode instance bootstrap
        run: node scripts/host-bootstrap-probe.mjs
        env:
          OPENCODE_PRINT_LOGS: "1"
          OPENCODE_LOG_LEVEL: DEBUG
      - name: Run real OpenCode package-entry canary
        run: npm run canary:npm-entry
        env:
          OPENCODE_PRINT_LOGS: "1"
          OPENCODE_LOG_LEVEL: DEBUG
      - name: Run real-host lifecycle canary
        run: npm run canary:host
        env:
          OPENCODE_PRINT_LOGS: "1"
          OPENCODE_LOG_LEVEL: DEBUG

  real-opencode-semantic-canary:
    name: real OpenCode semantic completion (${{ matrix.os }})
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm install
      - run: npm run build
      - name: Install current OpenCode CLI
        run: npm install --no-save --package-lock=false opencode-ai@latest
      - name: Show OpenCode version
        run: npx --no-install opencode --version
      - name: Probe clean OpenCode instance bootstrap
        run: node scripts/host-bootstrap-probe.mjs
        env:
          OPENCODE_PRINT_LOGS: "1"
          OPENCODE_LOG_LEVEL: DEBUG
      - name: Run real-host native Todo orchestration canary
        run: node --import ./scripts/host-canary-bootstrap.mjs scripts/host-todo-canary.mjs
        env:
          OPENCODE_PRINT_LOGS: "1"
          OPENCODE_LOG_LEVEL: DEBUG
      - name: Run real-host semantic completion canary
        run: npm run canary:semantic
        env:
          OPENCODE_PRINT_LOGS: "1"
          OPENCODE_LOG_LEVEL: DEBUG

  real-opencode-steering-canary:
    name: real OpenCode active steering (${{ matrix.os }})
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm install
      - run: npm run build
      - name: Install current OpenCode CLI
        run: npm install --no-save --package-lock=false opencode-ai@latest
      - name: Show OpenCode version
        run: npx --no-install opencode --version
      - name: Probe clean OpenCode instance bootstrap
        run: node scripts/host-bootstrap-probe.mjs
        env:
          OPENCODE_PRINT_LOGS: "1"
          OPENCODE_LOG_LEVEL: DEBUG
      - name: Run real-host active edit steering canary
        run: npm run canary:steering
        env:
          OPENCODE_PRINT_LOGS: "1"
          OPENCODE_LOG_LEVEL: DEBUG
