name: Publish npm stable

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-npm.yml
      - package.json

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish 1.3.25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30f803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Enforce workflow security policy
        run: node scripts/actions-security-gate.mjs
      - name: Verify trusted-publishing runtime
        shell: bash
        run: |
          node --version
          NPM_VERSION="$(npm --version)"
          echo "npm $NPM_VERSION"
          NPM_VERSION="$NPM_VERSION" node -e 'const [major, minor] = process.env.NPM_VERSION.split(".").map(Number); if (major < 11 || (major === 11 && minor < 5)) { console.error("npm >= 11.5.1 is required for trusted publishing"); process.exit(1) }'
      - name: Decide whether stable needs publishing
        id: release
        shell: bash
        run: |
          EXPECTED="1.3.25"
          ACTUAL="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Package version $ACTUAL is not the one-shot stable $EXPECTED; skipping."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "verify=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "verify=true" >> "$GITHUB_OUTPUT"
          if npm view "@bybrawe/opencode-goal@$EXPECTED" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "@bybrawe/opencode-goal@$EXPECTED is already published; publish will be skipped but registry verification will still run."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Verify predecessor stable ordering
        if: steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          PREVIOUS="1.3.24"
          VERSION=""
          LATEST=""
          BIN=""
          for attempt in $(seq 1 30); do
            VERSION="$(npm view "@bybrawe/opencode-goal@$PREVIOUS" version --registry=https://registry.npmjs.org 2>/dev/null || true)"
            LATEST="$(npm view "@bybrawe/opencode-goal@latest" version --registry=https://registry.npmjs.org 2>/dev/null || true)"
            BIN="$(npm view "@bybrawe/opencode-goal@$PREVIOUS" bin.opencode-goal --registry=https://registry.npmjs.org 2>/dev/null || true)"
            if [ "$VERSION" = "$PREVIOUS" ] && [ "$LATEST" = "$PREVIOUS" ] && { [ "$BIN" = "bin/opencode-goal.js" ] || [ "$BIN" = "./bin/opencode-goal.js" ]; }; then
              echo "Predecessor ordering verified on attempt $attempt: version=$VERSION latest=$LATEST bin=$BIN"
              exit 0
            fi
            echo "Predecessor not authoritative yet on attempt $attempt: version=$VERSION latest=$LATEST bin=$BIN"
            sleep 10
          done
          echo "Refusing to publish 1.3.25 until 1.3.24 is visible and authoritative as npm latest."
          exit 1
      - name: Install release dependencies
        if: steps.release.outputs.publish == 'true'
        run: npm install
      - name: Publish stable with npm trusted publishing
        if: steps.release.outputs.publish == 'true'
        run: npm publish --tag latest --access public
      - name: Verify published installer bin
        if: steps.release.outputs.verify == 'true'
        shell: bash
        run: |
          EXPECTED="1.3.25"
          VERSION=""
          LATEST=""
          BIN=""
          for attempt in 1 2 3 4 5 6; do
            VERSION="$(npm view "@bybrawe/opencode-goal@$EXPECTED" version --registry=https://registry.npmjs.org 2>/dev/null || true)"
            LATEST="$(npm view "@bybrawe/opencode-goal@latest" version --registry=https://registry.npmjs.org 2>/dev/null || true)"
            BIN="$(npm view "@bybrawe/opencode-goal@$EXPECTED" bin.opencode-goal --registry=https://registry.npmjs.org 2>/dev/null || true)"
            if [ "$VERSION" = "$EXPECTED" ] && [ "$LATEST" = "$EXPECTED" ] && { [ "$BIN" = "bin/opencode-goal.js" ] || [ "$BIN" = "./bin/opencode-goal.js" ]; }; then
              echo "Registry manifest verified on attempt $attempt: version=$VERSION latest=$LATEST bin=$BIN"
              break
            fi
            echo "Registry manifest not ready on attempt $attempt: version=$VERSION latest=$LATEST bin=$BIN"
            sleep 5
          done
          if [ "$VERSION" != "$EXPECTED" ]; then
            echo "Published version did not become visible: $VERSION"
            exit 1
          fi
          if [ "$LATEST" != "$EXPECTED" ]; then
            echo "npm latest points to $LATEST instead of $EXPECTED"
            exit 1
          fi
          if [ "$BIN" != "bin/opencode-goal.js" ] && [ "$BIN" != "./bin/opencode-goal.js" ]; then
            echo "Published installer bin mismatch: $BIN"
            exit 1
          fi

          VERIFY_DIR="$(mktemp -d)"
          trap 'rm -rf "$VERIFY_DIR"' EXIT
          pushd "$VERIFY_DIR" >/dev/null
          INSTALLED_VERSION=""
          for attempt in 1 2 3 4 5 6; do
            if INSTALLED_VERSION="$(npm exec --yes --package="@bybrawe/opencode-goal@$EXPECTED" -- opencode-goal --version 2>installer-error.log)"; then
              if [ "$INSTALLED_VERSION" = "$EXPECTED" ]; then
                echo "Published installer verified from clean consumer directory on attempt $attempt: $INSTALLED_VERSION"
                break
              fi
            fi
            echo "Published installer not ready on attempt $attempt: $INSTALLED_VERSION"
            cat installer-error.log || true
            sleep 5
          done
          popd >/dev/null
          if [ "$INSTALLED_VERSION" != "$EXPECTED" ]; then
            echo "Published installer reported $INSTALLED_VERSION instead of $EXPECTED"
            exit 1
          fi
