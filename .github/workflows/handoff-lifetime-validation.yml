name: Native handoff unload validation
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/handoff-lifetime-candidate.py'
      - '.github/workflows/handoff-lifetime-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-handoff-unload-candidate
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'ByBrawe/opencode-goal' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - run: npm install
      - name: Reproduce four late-handoff regressions before applying the fix
        shell: bash
        run: |
          python .github/scripts/handoff-lifetime-candidate.py tests
          npm run build
          node --check test/opencode2-handoff-lifetime.test.mjs
          node --check scripts/opencode2-unit-handoff-canary.mjs
          if node --test --test-reporter=tap test/opencode2-handoff-lifetime.test.mjs > "$RUNNER_TEMP/baseline.log" 2>&1; then
            cat "$RUNNER_TEMP/baseline.log"
            echo 'Original handoff unexpectedly passed; review before changing source'
            exit 1
          fi
          cat "$RUNNER_TEMP/baseline.log"
          grep -q '# fail 4' "$RUNNER_TEMP/baseline.log"
          grep -q 'handoff dispatched a host request after unload' "$RUNNER_TEMP/baseline.log"
          grep -q 'late admission result must not delete' "$RUNNER_TEMP/baseline.log"
          grep -q 'handoff started a persistence write after unload' "$RUNNER_TEMP/baseline.log"
      - name: Apply narrowly anchored correction and run complete gates
        shell: bash
        run: |
          python .github/scripts/handoff-lifetime-candidate.py fix
          npm run check
          npm run build
          node --test --test-reporter=tap test/opencode2-handoff-lifetime.test.mjs
          npm test > "$RUNNER_TEMP/tests.log" 2>&1 || { tail -140 "$RUNNER_TEMP/tests.log"; exit 1; }
          tail -18 "$RUNNER_TEMP/tests.log"
          npm run eval > "$RUNNER_TEMP/eval.log" 2>&1 || { tail -100 "$RUNNER_TEMP/eval.log"; exit 1; }
          tail -25 "$RUNNER_TEMP/eval.log"
          npm run package:smoke
          git diff --check
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        if: matrix.os == 'ubuntu-latest'
        with:
          repository: ByBrawe/opencode-loop
          ref: 0c27cb470cf310295e6cc78e1d2b61c2c443c316
          path: companion-loop
          persist-credentials: false
      - name: Exact native host, complete contract through three sessions, and Loop coexistence
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/native-host" --package-lock=false @opencode/cli@2.0.18
          export OPENCODE2_BINARY="$RUNNER_TEMP/native-host/node_modules/.bin/opencode2"
          test "$("$OPENCODE2_BINARY" --version)" = 'opencode v2.0.18'
          node scripts/opencode2-unit-handoff-canary.mjs > "$RUNNER_TEMP/handoff.log" 2>&1 || { tail -150 "$RUNNER_TEMP/handoff.log"; exit 1; }
          head -55 "$RUNNER_TEMP/handoff.log"
          (cd companion-loop && npm ci && npm run build:plugin)
          export OPENCODE_GOAL_INSTALLER="$GITHUB_WORKSPACE/dist/install.js"
          export OPENCODE_GOAL_V2_PLUGIN_URL="file://$GITHUB_WORKSPACE/dist/server.js"
          export OPENCODE2_CURRENT_COMMAND_FIELDS=1
          export OPENCODE2_NATIVE_REQUIRED=1
          (cd companion-loop && node scripts/native-install-pair-test.mjs && node scripts/opencode2-loop-canary.mjs && node scripts/native-cli-host-canary.mjs)
      - name: Store exact tested blobs without changing branches
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs'
          import { createHash } from 'node:crypto'
          const paths = ['src/opencode2/experimental.ts', 'test/opencode2-handoff-lifetime.test.mjs', 'scripts/opencode2-unit-handoff-canary.mjs', 'docs/OPENCODE2-HANDOFF-LIFETIME.md']
          for (const path of paths) {
            const data = readFileSync(path)
            const expected = createHash('sha1').update(`blob ${data.length}\0`).update(data).digest('hex')
            const response = await fetch('https://api.github.com/repos/ByBrawe/opencode-goal/git/blobs', {
              method: 'POST',
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ content: data.toString('base64'), encoding: 'base64' }),
            })
            if (!response.ok) throw new Error(`blob HTTP ${response.status}`)
            const result = await response.json()
            if (result.sha !== expected) throw new Error('tested source digest mismatch')
            console.log(`VERIFIED_FILE ${path} ${result.sha}`)
          }
          console.log(`CHECKOUT ${process.env.GITHUB_SHA}; LOOP 0c27cb470cf310295e6cc78e1d2b61c2c443c316`)
          console.log('No branch was changed and no package was published.')
          JS
