name: Fix 1.3.19 release notes

on:
  push:
    branches: [release/1.3.19-final-current]
    paths:
      - ".github/workflows/fix-release-notes-1.3.19.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: release/1.3.19-final-current
          fetch-depth: 0
      - name: Patch exact 1.3.19 notes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const file = 'CHANGELOG.md'
          let text = fs.readFileSync(file, 'utf8')
          const before = `- Retry transient Windows \`EPERM\`, \`EACCES\`, and \`EBUSY\` access/share denials while reading canonical Goal process-lock owner metadata, using a small bounded backoff window.\n- Preserve fail-closed semantics across both paths: shell hashing/deduplication/revision ownership and completion evidence stay unchanged, while \`ENOENT\`, malformed lock metadata, CAS/lease ownership, POSIX behavior, and persistent Windows access failures keep their existing authority.\n- Add regressions proving three distinct timed-out shell turns still reach the normal stall pause and one transient Windows lock-read denial recovers to \`lock_timeout\` while a persistent denial still escapes unchanged.`
          const after = `- Retry transient Windows \`EPERM\`, \`EACCES\`, and \`EBUSY\` access/share denials for both canonical Goal process-lock owner reads and canonical hard-link \`lstat()\` inspection, using the same small bounded backoff window.\n- Preserve fail-closed semantics across both paths: shell hashing/deduplication/revision ownership and completion evidence stay unchanged, while \`ENOENT\`, malformed lock metadata, symlink/junction safety, CAS/lease ownership, POSIX behavior, and persistent Windows access failures keep their existing authority.\n- Add regressions proving three distinct timed-out shell turns still reach the normal stall pause, transient Windows owner-read or \`lstat()\` denial recovers to normal \`lock_timeout\`, and persistent denial still escapes unchanged.`
          if (!text.includes(before)) throw new Error('expected 1.3.19 release-note block not found')
          text = text.replace(before, after)
          fs.writeFileSync(file, text)
          NODE
      - name: Commit corrected notes and remove helper
        shell: bash
        run: |
          rm .github/workflows/fix-release-notes-1.3.19.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md .github/workflows/fix-release-notes-1.3.19.yml
          git commit -m "docs: include Windows lstat hardening in 1.3.19 notes"
          git push origin HEAD:release/1.3.19-final-current
