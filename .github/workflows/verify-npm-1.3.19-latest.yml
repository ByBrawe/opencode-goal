name: Verify npm 1.3.19 latest

on:
  push:
    branches: [verify/npm-1.3.19-latest]
    paths:
      - .github/workflows/verify-npm-1.3.19-latest.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: verify/npm-1.3.19-latest
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Wait for exact registry metadata
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="1.3.19"
          VERSION=""
          LATEST=""
          BIN=""
          for attempt in $(seq 1 30); do
            VERSION="$(npm view "@bybrawe/opencode-goal@$EXPECTED" version --registry=https://registry.npmjs.org 2>/dev/null || true)"
            LATEST="$(npm view "@bybrawe/opencode-goal@latest" version --registry=https://registry.npmjs.org 2>/dev/null || true)"
            BIN="$(npm view "@bybrawe/opencode-goal@$EXPECTED" bin.opencode-goal --registry=https://registry.npmjs.org 2>/dev/null || true)"
            echo "attempt=$attempt version=$VERSION latest=$LATEST bin=$BIN"
            if [ "$VERSION" = "$EXPECTED" ] && [ "$LATEST" = "$EXPECTED" ] && { [ "$BIN" = "bin/opencode-goal.js" ] || [ "$BIN" = "./bin/opencode-goal.js" ]; }; then
              break
            fi
            sleep 5
          done
          test "$VERSION" = "$EXPECTED"
          test "$LATEST" = "$EXPECTED"
          test "$BIN" = "bin/opencode-goal.js" -o "$BIN" = "./bin/opencode-goal.js"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "bin=$BIN" >> "$GITHUB_OUTPUT"
      - name: Verify clean installer
        id: installer
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="1.3.19"
          VERIFY_DIR="$(mktemp -d)"
          trap 'rm -rf "$VERIFY_DIR"' EXIT
          pushd "$VERIFY_DIR" >/dev/null
          INSTALLED=""
          for attempt in $(seq 1 18); do
            if INSTALLED="$(npm exec --yes --package="@bybrawe/opencode-goal@$EXPECTED" -- opencode-goal --version 2>installer-error.log)"; then
              echo "attempt=$attempt installed=$INSTALLED"
              if [ "$INSTALLED" = "$EXPECTED" ]; then
                break
              fi
            else
              echo "attempt=$attempt installer failed"
              cat installer-error.log || true
            fi
            sleep 5
          done
          popd >/dev/null
          test "$INSTALLED" = "$EXPECTED"
          echo "installed=$INSTALLED" >> "$GITHUB_OUTPUT"
      - name: Persist verification evidence
        shell: bash
        env:
          VERSION: ${{ steps.registry.outputs.version }}
          LATEST: ${{ steps.registry.outputs.latest }}
          BIN: ${{ steps.registry.outputs.bin }}
          INSTALLED: ${{ steps.installer.outputs.installed }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          const evidence = {
            package: '@bybrawe/opencode-goal',
            expected: '1.3.19',
            version: process.env.VERSION,
            latest: process.env.LATEST,
            bin: process.env.BIN,
            cleanInstallerVersion: process.env.INSTALLED,
            verifiedAt: new Date().toISOString(),
            registry: 'https://registry.npmjs.org',
          }
          fs.writeFileSync('npm-1.3.19-verification.json', `${JSON.stringify(evidence, null, 2)}\n`)
          NODE
          rm .github/workflows/verify-npm-1.3.19-latest.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add npm-1.3.19-verification.json .github/workflows/verify-npm-1.3.19-latest.yml
          git commit -m "test: record npm 1.3.19 publication evidence"
          git push origin HEAD:verify/npm-1.3.19-latest
