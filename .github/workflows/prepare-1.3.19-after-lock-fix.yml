name: Prepare clean 1.3.19 release metadata

on:
  push:
    branches: [release/1.3.19-after-lock-fix]
    paths:
      - .github/workflows/prepare-1.3.19-after-lock-fix.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/1.3.19-after-lock-fix
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Prepare release metadata
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')

          const pkgPath = 'package.json'
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'))
          if (pkg.version !== '1.3.18') throw new Error(`unexpected package version: ${pkg.version}`)
          pkg.version = '1.3.19'
          fs.writeFileSync(pkgPath, `${JSON.stringify(pkg, null, 2)}\n`)

          const publishPath = '.github/workflows/publish-npm.yml'
          let publish = fs.readFileSync(publishPath, 'utf8')
          const publishMatches = publish.match(/1\.3\.18/g) || []
          if (publishMatches.length !== 3) throw new Error(`expected 3 publisher 1.3.18 references, got ${publishMatches.length}`)
          publish = publish.replace(/1\.3\.18/g, '1.3.19')
          fs.writeFileSync(publishPath, publish)

          const releasingPath = 'RELEASING.md'
          let releasing = fs.readFileSync(releasingPath, 'utf8')
          const guard = 'The current one-shot stable guard is:\n\n```text\n1.3.9\n```'
          if (!releasing.includes(guard)) throw new Error('stale one-shot guard marker not found')
          releasing = releasing.replace(guard, 'The current one-shot stable guard is:\n\n```text\n1.3.19\n```')
          fs.writeFileSync(releasingPath, releasing)

          const changelogPath = 'CHANGELOG.md'
          let changelog = fs.readFileSync(changelogPath, 'utf8')
          if (changelog.includes('## 1.3.19 —')) throw new Error('1.3.19 changelog section already exists')
          const marker = '## 1.3.18 — 2026-08-18'
          if (!changelog.includes(marker)) throw new Error('1.3.18 changelog marker not found')
          const section = [
            '## 1.3.19 — 2026-08-18',
            '',
            'Shell completion and Windows Goal storage reliability hotfix.',
            '',
            '- Count Goal-owned `bash` activity as host progress only when OpenCode reports a finite numeric process exit; timeout/abort or missing exit metadata remains no-progress, while ordinary nonzero exits still count as completed diagnostic work.',
            '- Retry transient Windows `EPERM`, `EACCES`, and `EBUSY` access/share denials both while reading canonical Goal process-lock owner metadata and while `lstat()`-checking the canonical hard-link, using the same bounded backoff window.',
            '- Preserve fail-closed semantics: `ENOENT`, malformed lock metadata, symlink/junction safety, CAS/lease ownership, POSIX behavior, and persistent Windows access denials retain their prior authority.',
            '- Add regressions proving three distinct timed-out shell turns still reach the normal stall pause, transient Windows owner-read/lstat denials recover to `lock_timeout`, and persistent denials still escape unchanged.',
            '',
          ].join('\n')
          changelog = changelog.replace(marker, `${section}\n${marker}`)
          fs.writeFileSync(changelogPath, changelog)
          NODE

          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/publish-npm.yml' 'CHANGELOG.md' 'RELEASING.md' 'package.json' | sort)"
          test "$actual" = "$expected"

      - name: Commit tested release metadata and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/prepare-1.3.19-after-lock-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/publish-npm.yml CHANGELOG.md RELEASING.md package.json .github/workflows/prepare-1.3.19-after-lock-fix.yml
          git commit -m "release: prepare 1.3.19 after Windows lock fix"
          git push origin HEAD:release/1.3.19-after-lock-fix
