name: Probe npm 1.3.18 ordering gate

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/probe-1.3.18-registry.yml"
      - ".github/workflows/publish-npm.yml"
      - "package.json"
      - "CHANGELOG.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  probe:
    name: npm 1.3.18 ordering probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Query exact version and latest dist-tag
        shell: bash
        run: |
          set -euo pipefail
          KNOWN="$(npm view '@bybrawe/opencode-goal@1.3.17' version --registry=https://registry.npmjs.org)"
          if [ "$KNOWN" != "1.3.17" ]; then
            echo "Registry connectivity control failed: expected 1.3.17, got '$KNOWN'"
            exit 1
          fi

          VERSION="$(npm view '@bybrawe/opencode-goal@1.3.18' version --registry=https://registry.npmjs.org 2>/dev/null || true)"
          LATEST="$(npm view '@bybrawe/opencode-goal' dist-tags.latest --registry=https://registry.npmjs.org)"

          echo "NPM_PROBE_KNOWN=$KNOWN"
          echo "NPM_PROBE_1_3_18=${VERSION:-UNPUBLISHED}"
          echo "NPM_PROBE_LATEST=$LATEST"

          {
            echo "## npm release ordering probe"
            echo "- known control: \`$KNOWN\`"
            echo "- 1.3.18: \`${VERSION:-UNPUBLISHED}\`"
            echo "- latest: \`$LATEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
