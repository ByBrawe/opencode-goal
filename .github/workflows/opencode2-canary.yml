name: Experimental OpenCode 2 Host

on:
  workflow_dispatch:
  schedule:
    - cron: "43 5 * * *"
  pull_request:
    paths:
      - "src/opencode2/**"
      - "scripts/opencode2-*.mjs"
      - "scripts/run-opencode2-host-ci.mjs"
      - ".github/workflows/opencode2-canary.yml"
  push:
    branches: [main]
    paths:
      - "src/opencode2/**"
      - "scripts/opencode2-*.mjs"
      - "scripts/run-opencode2-host-ci.mjs"
      - ".github/workflows/opencode2-canary.yml"

permissions:
  contents: read

jobs:
  plugin-host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: node scripts/run-opencode2-host-ci.mjs
