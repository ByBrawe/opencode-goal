name: Experimental OpenCode 2 Host

on:
  workflow_dispatch:
  schedule:
    - cron: "43 5 * * *"
  push:
    branches: [main]
    paths:
      - "src/opencode2/**"
      - "src/server.ts"
      - "scripts/opencode2-host-canary.mjs"
      - "scripts/opencode2-server-entry-canary.mjs"
      - "scripts/opencode2-promotion-capability-canary.mjs"
      - "scripts/opencode2-direct-lifecycle-canary.mjs"
      - "scripts/opencode2-autonomous-adapter-canary.mjs"
      - "scripts/opencode2-semantic-completion-canary.mjs"
      - "scripts/opencode2-telemetry-parity-canary.mjs"
      - "scripts/opencode2-verifier-capability-canary.mjs"
      - "scripts/opencode2-runtime-capability-canary.mjs"
      - "scripts/opencode2-runtime-probe-plugin.mjs"
      - "scripts/run-opencode2-host-ci.mjs"
      - ".github/workflows/opencode2-canary.yml"
      - "package.json"
  pull_request:
    paths:
      - "src/opencode2/**"
      - "src/server.ts"
      - "scripts/opencode2-host-canary.mjs"
      - "scripts/opencode2-server-entry-canary.mjs"
      - "scripts/opencode2-promotion-capability-canary.mjs"
      - "scripts/opencode2-direct-lifecycle-canary.mjs"
      - "scripts/opencode2-autonomous-adapter-canary.mjs"
      - "scripts/opencode2-semantic-completion-canary.mjs"
      - "scripts/opencode2-telemetry-parity-canary.mjs"
      - "scripts/opencode2-verifier-capability-canary.mjs"
      - "scripts/opencode2-runtime-capability-canary.mjs"
      - "scripts/opencode2-runtime-probe-plugin.mjs"
      - "scripts/run-opencode2-host-ci.mjs"
      - ".github/workflows/opencode2-canary.yml"
      - "package.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plugin-host:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: node scripts/run-opencode2-host-ci.mjs

  exact-server-entry:
    name: OpenCode 2.0.11 package server entry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm install
      - run: npm run build
      - name: Install exact OpenCode 2.0.11
        run: npm install -g @opencode/cli@2.0.11
      - name: Verify dual server entry on exact host
        run: node scripts/opencode2-server-entry-canary.mjs

  promotion-capabilities:
    name: OpenCode 2.0.11 lifecycle promotion capabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install exact OpenCode 2.0.11
        run: npm install -g @opencode/cli@2.0.11
      - name: Check promotion capability canary syntax
        run: node --check scripts/opencode2-promotion-capability-canary.mjs
      - name: Prove direct command origin and model tool settlement
        run: node scripts/opencode2-promotion-capability-canary.mjs


  runtime-capabilities:
    name: OpenCode 2.0.11 runtime event capabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm install
      - run: npm run build
      - name: Install exact OpenCode 2.0.11
        run: npm install -g @opencode/cli@2.0.11
      - name: Check runtime capability canary syntax
        run: node --check scripts/opencode2-runtime-capability-canary.mjs && node --check scripts/opencode2-runtime-probe-plugin.mjs
      - name: Prove event delivery, no-progress turn closing, and compaction hook registration
        run: node scripts/opencode2-runtime-capability-canary.mjs


  autonomous-adapter:
    name: OpenCode 2.0.11 autonomous Goal coordinator
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm install
      - run: npm run build
      - name: Install exact OpenCode 2.0.11
        run: npm install -g @opencode/cli@2.0.11
      - name: Check autonomous adapter canary syntax
        run: node --check scripts/opencode2-autonomous-adapter-canary.mjs
      - name: Prove exact owned autonomous continuation
        run: node scripts/opencode2-autonomous-adapter-canary.mjs

  telemetry-parity:
    name: OpenCode 2.0.11 V1 telemetry runtime parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm install
      - run: npm run build
      - name: Install exact OpenCode 2.0.11
        run: npm install -g @opencode/cli@2.0.11
      - name: Check telemetry parity canary syntax
        run: node --check scripts/opencode2-telemetry-parity-canary.mjs
      - name: Prove V1 telemetry runtime semantics on exact host
        run: node scripts/opencode2-telemetry-parity-canary.mjs

  semantic-completion:
    name: OpenCode 2.0.11 V1-grade semantic completion
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm install
      - run: npm run build
      - name: Install exact OpenCode 2.0.11
        run: npm install -g @opencode/cli@2.0.11
      - name: Check semantic completion canary syntax
        run: node --check scripts/opencode2-semantic-completion-canary.mjs
      - name: Prove V1-grade completion evidence on exact host
        run: node scripts/opencode2-semantic-completion-canary.mjs

  verifier-capabilities:
    name: OpenCode 2.0.11 verifier child-session capabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install exact OpenCode 2.0.11
        run: npm install -g @opencode/cli@2.0.11
      - name: Check verifier capability canary syntax
        run: node --check scripts/opencode2-verifier-capability-canary.mjs
      - name: Prove verifier child-session and read-only tool boundary
        run: node scripts/opencode2-verifier-capability-canary.mjs

  direct-lifecycle-capability:
    name: OpenCode 2.0.11 authorized Goal lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm install
      - run: npm run build
      - name: Install exact OpenCode 2.0.11
        run: npm install -g @opencode/cli@2.0.11
      - name: Check direct lifecycle canary syntax
        run: node --check scripts/opencode2-direct-lifecycle-canary.mjs
      - name: Prove real-host Location fail-closed lifecycle guard
        run: node scripts/opencode2-direct-lifecycle-canary.mjs --location-only
      - name: Prove host-bound single-use lifecycle persistence
        run: node scripts/opencode2-direct-lifecycle-canary.mjs
