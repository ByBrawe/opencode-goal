name: Current OpenCode 2 Todo Capability

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/opencode2-current-todo-capability-canary.mjs"
      - ".github/workflows/opencode2-current-todo-canary.yml"

permissions:
  contents: read

jobs:
  current-v2-todo:
    name: OpenCode 2.0.15 native Todo capability
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm install
      - run: npm run build
      - name: Install OpenCode 2.0.15
        run: npm install -g @opencode/cli@2.0.15
      - name: Check Todo capability canary syntax
        run: node --check scripts/opencode2-current-todo-capability-canary.mjs
      - name: Prove current V2 native Todo exposure
        run: node scripts/opencode2-current-todo-capability-canary.mjs
