name: PR6 Quality Gate

on:
  pull_request_target:
    types: [reopened]

permissions:
  contents: read

jobs:
  validate:
    if: github.event.pull_request.number == 6 && github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm install
      - run: npm run check
      - run: npm test
      - run: bun -e "await import('./dist/index.js')"
      - name: Install current OpenCode CLI
        run: npm install --no-save --package-lock=false opencode-ai@latest
      - name: Show OpenCode version
        run: npx --no-install opencode --version
      - name: Probe clean OpenCode bootstrap
        run: node scripts/host-bootstrap-probe.mjs
        env:
          OPENCODE_PRINT_LOGS: "1"
          OPENCODE_LOG_LEVEL: DEBUG
      - name: Real lifecycle
        run: npm run canary:host
        env:
          OPENCODE_PRINT_LOGS: "1"
          OPENCODE_LOG_LEVEL: DEBUG
      - name: Real semantic completion
        run: npm run canary:semantic
        env:
          OPENCODE_PRINT_LOGS: "1"
          OPENCODE_LOG_LEVEL: DEBUG
      - name: Real active steering
        run: npm run canary:steering
        env:
          OPENCODE_PRINT_LOGS: "1"
          OPENCODE_LOG_LEVEL: DEBUG
      - name: Real host progress and no-progress guard
        run: npm run canary:progress
        env:
          OPENCODE_PRINT_LOGS: "1"
          OPENCODE_LOG_LEVEL: DEBUG

  finalize:
    if: always() && github.event.pull_request.number == 6 && github.event.pull_request.head.repo.full_name == github.repository
    needs: [validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge exact validated PR head
        if: needs.validate.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          current="$(gh api "repos/$REPO/pulls/6" --jq .head.sha)"
          test "$current" = "$HEAD_SHA"
          gh api --method PUT "repos/$REPO/pulls/6/merge" \
            -f merge_method=squash \
            -f sha="$HEAD_SHA" \
            -f commit_title='fix: make host progress reliable in git and non-git workspaces' \
            -f commit_message='Track revision-owned write/edit/apply_patch calls by OpenCode call ID, derive no-op-resistant progress from canonical project-local file content hashes, retain PatchPart as a git/shell fallback, and verify mutation, no-op, and three-turn no-progress pause behavior on Windows and Ubuntu.'
      - uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ github.token }}
      - name: Remove one-shot gate
        shell: bash
        run: |
          git pull --ff-only origin main
          rm .github/workflows/pr6-quality-gate.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -u .github/workflows/pr6-quality-gate.yml
          git commit -m 'ci: remove PR6 quality gate'
          git push origin HEAD:main
