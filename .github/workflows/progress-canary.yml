name: Real Patch Progress

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  progress:
    name: PatchPart progress (${{ matrix.os }})
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm install
      - run: npm run build
      - name: Install current OpenCode CLI
        run: npm install --no-save --package-lock=false opencode-ai@latest
      - name: Show OpenCode version
        run: npx --no-install opencode --version
      - name: Probe clean OpenCode instance bootstrap
        run: node scripts/host-bootstrap-probe.mjs
        env:
          OPENCODE_PRINT_LOGS: "1"
          OPENCODE_LOG_LEVEL: DEBUG
      - name: Run real PatchPart/no-op progress canary
        id: canary
        shell: bash
        run: |
          set +e
          npm run canary:progress > progress-canary.log 2>&1
          code=$?
          cat progress-canary.log
          exit $code
        env:
          OPENCODE_PRINT_LOGS: "1"
          OPENCODE_LOG_LEVEL: DEBUG
      - name: Capture Windows failure diagnostics
        if: failure() && matrix.os == 'windows-latest' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          tail -n 240 progress-canary.log > progress-canary-windows-failure.txt
          git fetch origin ci/real-patch-progress
          git checkout ci/real-patch-progress
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add progress-canary-windows-failure.txt
          git commit -m "ci: capture Windows progress canary diagnostics"
          git push origin HEAD:ci/real-patch-progress
