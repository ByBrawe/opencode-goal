name: V2 lifetime hardening pass
on:
  push:
    branches: [main]
    paths: [.github/workflows/v2-lifetime-pass.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v2-lifetime-hardening-main
  cancel-in-progress: false
jobs:
  verify-and-commit:
    if: github.repository == 'ByBrawe/opencode-goal' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: npm install
      - run: npm run build
      - name: Add real-adapter unload regressions using the existing host fixture
        shell: bash
        run: |
          cat >> test/opencode2-experimental.test.mjs <<'TEST'

          function unloadDeferred() {
            let resolve, reject
            const promise = new Promise((yes, no) => { resolve = yes; reject = no })
            return { promise, resolve, reject }
          }

          for (const phase of ["after-unload", "during-recovery-read"]) {
            test(`V2 unload fence: ${phase} cannot mutate the persisted Goal`, async () => {
              const root = await mkdtemp(path.join(os.tmpdir(), "goal-v2-unload-fence-"))
              try {
                await withAutonomousPreview(async () => {
                  const host = fakeV2EventContext(root)
                  const sessionID = `v2-unload-${phase}`
                  const store = new GoalStore(root)
                  const failure = unloadDeferred()
                  const readEntered = unloadDeferred()
                  const releaseRead = unloadDeferred()
                  const originalPrompt = host.ctx.session.prompt
                  const originalLoad = GoalStore.prototype.load
                  const originalSave = GoalStore.prototype.save
                  let resumeStarted = false
                  let cleanup
                  let saveCalls = 0
                  const pendingSaves = []
                  host.ctx.session.prompt = (input) => {
                    if (input.resume === true && input.metadata?.opencode_goal_v2_autonomous === true) {
                      resumeStarted = true
                      return failure.promise
                    }
                    return originalPrompt(input)
                  }
                  try {
                    cleanup = await OpenCode2GoalsExperimental.setup(host.ctx)
                    const command = "verify unload ownership"
                    const dispatched = await dispatchDirectCommand(host, sessionID, command)
                    await armCapability(host, sessionID, dispatched.messageID)
                    await host.emitEvent({ type: "session.execution.started", data: { sessionID } })
                    await consumeCapability(host, sessionID, command)
                    await host.emitEvent({ type: "session.execution.succeeded", data: { sessionID } })
                    await waitForValue(() => resumeStarted, "deferred native Goal resume")
                    const before = await store.load(sessionID)
                    assert.equal(before.status, "active")

                    if (phase === "during-recovery-read") {
                      let hold = true
                      GoalStore.prototype.load = async function (...args) {
                        const goal = await originalLoad.apply(this, args)
                        if (hold && args[0] === sessionID) {
                          hold = false
                          readEntered.resolve()
                          await releaseRead.promise
                        }
                        return goal
                      }
                      failure.reject(new Error("late native transport failure"))
                      await readEntered.promise
                    }
                    await cleanup()
                    GoalStore.prototype.save = function (...args) {
                      saveCalls++
                      const result = originalSave.apply(this, args)
                      pendingSaves.push(result)
                      return result
                    }
                    let readsAfterUnload = 0
                    const originalGet = host.ctx.session.get
                    host.ctx.session.get = (...args) => {
                      readsAfterUnload++
                      return originalGet(...args)
                    }
                    if (phase === "after-unload") failure.reject(new Error("late native transport failure"))
                    else releaseRead.resolve()
                    // Flush continuations after the controlled async boundary. The
                    // save spy fires synchronously before any disk write is awaited.
                    for (let i = 0; i < 4; i++) await new Promise((resolve) => setImmediate(resolve))
                    assert.equal(readsAfterUnload, 0, "unloaded generation must not start failure recovery")
                    assert.equal(saveCalls, 0, "unloaded generation must not persist late failure recovery")
                    assert.deepEqual(await originalLoad.call(store, sessionID), before)
                  } finally {
                    releaseRead.resolve()
                    failure.resolve({ id: "cleanup-only" })
                    await cleanup?.().catch(() => {})
                    await new Promise((resolve) => setTimeout(resolve, 100))
                    await Promise.allSettled(pendingSaves)
                    GoalStore.prototype.load = originalLoad
                    GoalStore.prototype.save = originalSave
                  }
                })
              } finally {
                await rm(root, { recursive: true, force: true, maxRetries: 5, retryDelay: 20 })
              }
            })
          }

          test("V2 synchronous native resume rejection follows bounded failure recovery", async () => {
            const root = await mkdtemp(path.join(os.tmpdir(), "goal-v2-sync-resume-"))
            try {
              await withAutonomousPreview(async () => {
                const host = fakeV2EventContext(root)
                const sessionID = "v2-sync-resume"
                const store = new GoalStore(root)
                const originalPrompt = host.ctx.session.prompt
                host.ctx.session.prompt = (input) => {
                  if (input.resume === true && input.metadata?.opencode_goal_v2_autonomous === true) {
                    throw new Error("synchronous native resume sentinel")
                  }
                  return originalPrompt(input)
                }
                const cleanup = await OpenCode2GoalsExperimental.setup(host.ctx)
                try {
                  const command = "test synchronous native admission rejection"
                  const dispatched = await dispatchDirectCommand(host, sessionID, command)
                  await armCapability(host, sessionID, dispatched.messageID)
                  await host.emitEvent({ type: "session.execution.started", data: { sessionID } })
                  await consumeCapability(host, sessionID, command)
                  await host.emitEvent({ type: "session.execution.succeeded", data: { sessionID } })
                  const paused = await waitForValue(async () => {
                    const goal = await store.load(sessionID)
                    return goal?.status === "paused" ? goal : undefined
                  }, "synchronous resume rejection to settle safely")
                  assert.match(paused.stopReason, /synchronous native resume sentinel/)
                  assert.equal(host.prompts.filter((input) => input.metadata?.opencode_goal_v2_autonomous === true).length, 1)
                } finally { await cleanup() }
              })
            } finally {
              await rm(root, { recursive: true, force: true, maxRetries: 5, retryDelay: 20 })
            }
          })
          TEST
      - name: Prove the existing disposed-generation mutation before changing source
        shell: bash
        run: |
          if node --test --test-name-pattern='V2 unload fence' test/opencode2-experimental.test.mjs > "$RUNNER_TEMP/goal-lifetime-before.log" 2>&1; then
            cat "$RUNNER_TEMP/goal-lifetime-before.log"
            echo 'Expected the original unload-fence regressions to fail.'
            exit 1
          fi
          cat "$RUNNER_TEMP/goal-lifetime-before.log"
          grep -q 'unloaded generation must not' "$RUNNER_TEMP/goal-lifetime-before.log"
      - name: Bind admission and failure recovery to the live plugin generation
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs'
          import assert from 'node:assert/strict'
          const file = 'src/opencode2/experimental.ts'
          let source = readFileSync(file, 'utf8')
          const oldFailure = `    const pauseAutonomousDispatchFailure = async (
                sessionID: string,
                goalID: string,
                revision: number,
                error: unknown,
              ) => {
                try {
                  const { store, goal } = await coordinatorGoal(sessionID)
                  if (!goal || goal.id !== goalID || goal.revision !== revision || goal.status !== "active") return`
          const newFailure = `    const pauseAutonomousDispatchFailure = async (
                sessionID: string,
                goalID: string,
                revision: number,
                error: unknown,
              ) => {
                if (lifecycleAbort.signal.aborted) return
                try {
                  const { store, goal } = await coordinatorGoal(sessionID)
                  if (lifecycleAbort.signal.aborted || !goal || goal.id !== goalID || goal.revision !== revision || goal.status !== "active") return`
          assert.equal(source.split(oldFailure).length, 2, 'dispatch failure anchor changed')
          source = source.replace(oldFailure, newFailure)
          const start = source.indexOf('    const scheduleAutonomousContinuation = async (')
          const end = source.indexOf('    const findPreparedUnitHandoff = async (', start)
          assert.ok(start >= 0 && end > start, 'native continuation bounds changed')
          const replacement = `    const scheduleAutonomousContinuation = async (
                sessionID: string,
                expectedGoal: GoalState,
                prompt: string,
                source: OpenCode2GoalContinuationSource,
              ) => {
                if (lifecycleAbort.signal.aborted || !autonomousEnabled || autonomousDispatching.has(sessionID) || typeof ctx.session.prompt !== "function") return

                // Claim before the first await: concurrent triggers must not both
                // pass the guard while resolving the same persisted Goal.
                autonomousDispatching.add(sessionID)
                let messageID = ""
                let resumeOwnsSlot = false
                try {
                  const { goal } = await coordinatorGoal(sessionID)
                  if (
                    lifecycleAbort.signal.aborted
                    || !goal
                    || goal.id !== expectedGoal.id
                    || goal.revision !== expectedGoal.revision
                    || goal.status !== "active"
                    || isReadOnlyAgent(goal.execution?.agent)
                    || budgetLimitHits(goal.usage, goal.budget).length > 0
                    || Boolean(goal.infrastructureRecovery?.nextRetryAt && goal.infrastructureRecovery.nextRetryAt > Date.now())
                  ) return

                  const promptInput = {
                    sessionID,
                    text: prompt,
                    delivery: "steer" as const,
                    metadata: {
                      opencode_goal_v2_autonomous: true,
                      opencode_goal_v2_source: source,
                      opencode_goal_id: goal.id,
                      opencode_goal_revision: goal.revision,
                    },
                  }
                  const admitted = await ctx.session.prompt({ ...promptInput, resume: false })
                  messageID = firstString(record(admitted)?.id, nestedRecord(admitted, "data")?.id) ?? ""
                  if (!messageID) throw new Error("OpenCode 2 did not return a host user-message ID for Goal continuation admission")
                  if (lifecycleAbort.signal.aborted) return

                  rememberOpenCode2GoalPrompt(autonomousRuntime, sessionID, messageID, goal, source)
                  resumeOwnsSlot = true
                  queueMicrotask(() => {
                    // Enter through a promise so synchronous host errors follow
                    // the same recovery/finally path as rejected native requests.
                    void Promise.resolve().then(() => {
                      if (lifecycleAbort.signal.aborted) return
                      return ctx.session.prompt!({ ...promptInput, id: messageID, resume: true })
                    }).then((resumed) => {
                      const resumedMessageID = firstString(record(resumed)?.id, nestedRecord(resumed, "data")?.id)
                      if (resumedMessageID && resumedMessageID !== messageID) {
                        throw new Error("OpenCode 2 resumed Goal continuation with a different host user-message ID")
                      }
                    }).catch(async (error) => {
                      forgetOpenCode2GoalPrompt(autonomousRuntime, sessionID, messageID)
                      await pauseAutonomousDispatchFailure(sessionID, goal.id, goal.revision, error)
                    }).finally(() => autonomousDispatching.delete(sessionID))
                  })
                } catch (error) {
                  if (messageID) forgetOpenCode2GoalPrompt(autonomousRuntime, sessionID, messageID)
                  await pauseAutonomousDispatchFailure(sessionID, expectedGoal.id, expectedGoal.revision, error)
                } finally {
                  // A deferred native resume owns the slot until its own finally.
                  if (!resumeOwnsSlot) autonomousDispatching.delete(sessionID)
                }
              }

          `
          source = source.slice(0, start) + replacement + source.slice(end)
          writeFileSync(file, source)
          JS
      - name: Verify adapter regressions and the complete release checks
        shell: bash
        run: |
          npm run check
          npm test
          npm run eval
          npm run package:smoke
      - name: Record the joint migration plan and verified Goal increment
        shell: bash
        run: |
          mkdir -p docs
          cat > docs/opencode2-migration-plan.md <<'PLAN'
          # OpenCode 2 migration: Goal and Loop

          Started: 2026-09-29. Work directly on main; do not create repair branches.
          Baseline: Goal da4b1c1745e4fa76cf38f982c9582adf880fc7eb and Loop f4a7fedb47bfc03d7630eba6d708704d2d12517a.
          Pinned real-host baseline: OpenCode 2.0.18, not a promise about every later host.

          ## Goal

          Migrate behavior to the native V2 API rather than merely renaming imports.
          Preserve one continuation owner, Goal identity/revision, budgets, cumulative
          usage and host-verified evidence. Keep the explicitly supported V1 adapter
          isolated; never initialize it as a side effect of native V2 loading.

          ## Work plan and exit gates

          | Phase | Work | Exit gate | Status |
          | --- | --- | --- | --- |
          | 0 | Inspect both main branches and official V2 contracts | Baselines and full feature/capability matrix | Baselines recorded; full matrix pending |
          | 1 | Plugin lifetime, admission and reload safety | Negative regression followed by passing adapter and complete suites | Goal unload/admission increment verified by creating workflow |
          | 2 | Commands, tools, native options, installers and exported types | Native contract for each supported surface | Pending |
          | 3 | Completion, usage/retries, compaction and per-unit handoff | Same semantics across native execution and restart boundaries | Existing proof retained; expanded coverage pending |
          | 4 | Joint Goal/Loop ownership and diagnostics | No second continuation owner or false completion | Expanded real-host matrix pending |
          | 5 | Batch Windows/Linux and clean installed-package checks | Exact final main heads pass before any publication | Pending |

          ## First Goal increment

          - Claim the per-session dispatch slot before resolving persisted state.
            Overlapping triggers cannot both enter admission while a read is pending.
          - Keep that slot until native resume settles; always release it on rejected
            eligibility, lookup/admission failure and synchronous host exceptions.
          - Failure recovery checks plugin cancellation before and after its persisted
            state read. A removed generation cannot pause a Goal or enqueue recovery
            after a replacement plugin generation has taken responsibility.
          - A late admission response cannot repopulate old ownership or start work
            after unload. No native model, tool or compaction abort was introduced.

          The creating workflow reproduced the original post-unload recovery failures
          through the existing V2 adapter fixture, then ran check, the complete unit
          suite, adversarial eval and clean production-tarball smoke tests. New tests
          cover late rejection, unload during the recovery read and synchronous resume
          rejection. Whole-migration completion and real-provider performance remain
          separate gates, not implied by these unit tests.

          ## Remaining Goal audit

          Audit every source of native admission and every async handoff/recovery stage
          for cancellation, session/worktree binding and concurrent control changes.
          Verify runtime progress, model limits, budgets, independent verification,
          queued Goals, per-unit sessions, advisory notifications and TUI support.
          Use typed current V2 hooks instead of historical event-shape guesses where
          practical. Do not migrate durable Goal storage merely because another API
          exists; retain its tested locking, generation and evidence semantics.

          ## Joint constraints

          Goal owns unfinished sessions; Loop must not create a second continuation.
          Final units complete through existing checks and independent proof, not unit
          identity text. Retired handoff sources remain inert. Preserve existing fixes
          for Goal #228 and Loop #164; do not reopen or close unrelated issues to make
          the board appear clean. Source/main readiness is not npm publication.

          ## References

          - https://opencode.ai/v2/docs/build/plugins/migrate-v1
          - https://opencode.ai/v2/docs/build/plugins/
          - https://github.com/ByBrawe/opencode-loop/blob/main/docs/opencode2-migration-plan.md
          PLAN
      - name: Commit verified files only to unchanged main and retire this pass
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXPECTED=$(git rev-parse HEAD)
          CURRENT=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$EXPECTED" = "$CURRENT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/opencode2/experimental.ts test/opencode2-experimental.test.mjs docs/opencode2-migration-plan.md
          git rm -- .github/workflows/v2-lifetime-pass.yml
          git diff --cached --check
          git commit -m 'fix: fence native Goal dispatch and recovery by plugin lifetime'
          git -c credential.helper='!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' push origin HEAD:refs/heads/main
          echo "Verified Goal increment: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
