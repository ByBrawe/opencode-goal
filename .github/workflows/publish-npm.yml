name: Publish npm stable

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-npm.yml
      - package.json

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish 1.3.48
    if: github.repository == 'ByBrawe/opencode-goal' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
      id-token: write
    # 1.3.48 releases only after every required gate passes on this exact main SHA.
    # Carry the validated host-owned plain continuation recovery and same-session
    # re-arm after a real host restart. Preserve read-only Goal telemetry and
    # independent Loop installation; GUI/Desktop discovery is not claimed fixed.
    env:
      RELEASE_VERSION: '1.3.48'
      RELEASE_PREDECESSOR: '1.3.47'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Enforce workflow security policy
        run: node scripts/actions-security-gate.mjs
      - name: Verify trusted-publishing runtime
        run: |
          node --version
          npm --version
          node -e 'const v=require("child_process").execFileSync("npm",["--version"],{encoding:"utf8"}).trim().split(".").map(Number); if(v[0]<11 || (v[0]===11 && (v[1]<5 || (v[1]===5 && v[2]<1)))) throw Error("npm >=11.5.1 required")'
      - name: Decide whether stable needs publishing
        id: release
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs'
          import { assertRegistrySource } from './scripts/native-release-gate.mjs'
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          const output = (publish, verify) => appendFileSync(process.env.GITHUB_OUTPUT, `publish=${publish}\nverify=${verify}\n`)
          if (pkg.version !== process.env.RELEASE_VERSION) {
            console.log('No release requested for package version ' + pkg.version)
            output(false, false)
          } else {
            const base = 'https://registry.npmjs.org/' + encodeURIComponent(pkg.name)
            const response = await fetch(base + '/' + pkg.version, { signal: AbortSignal.timeout(20000) })
            if (response.ok) {
              assertRegistrySource(await response.json(), { name: pkg.name, version: pkg.version, sha: process.env.GITHUB_SHA })
              output(false, true)
            } else {
              if (response.status !== 404) throw new Error('Cannot determine immutable npm state: HTTP ' + response.status)
              const latest = await fetch(base + '/latest', { signal: AbortSignal.timeout(20000) })
              if (!latest.ok) throw new Error('Cannot verify predecessor: HTTP ' + latest.status)
              if ((await latest.json()).version !== process.env.RELEASE_PREDECESSOR) throw new Error('npm latest is not the expected predecessor; refusing a downgrade or out-of-order publish')
              output(true, true)
            }
          }
          JS
      - name: Wait for every release gate on this exact main commit
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/native-release-gate.mjs
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.release.outputs.publish == 'true'
        with:
          bun-version: '1.4.2'
      - name: Install and build exact Goal source
        if: steps.release.outputs.publish == 'true'
        run: npm install && npm run build
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: steps.release.outputs.publish == 'true'
        with:
          repository: ByBrawe/opencode-loop
          ref: 7dff8a5716d3ac768c79bc4e0a8c78ae7cc3f53e
          path: companion-loop
          persist-credentials: false
      - name: Real native pair and read-only status before publication
        if: steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/native-host" --package-lock=false @opencode/cli@2.0.18
          export OPENCODE2_BINARY="$RUNNER_TEMP/native-host/node_modules/.bin/opencode2"
          test "$("$OPENCODE2_BINARY" --version)" = 'opencode v2.0.18'
          export OPENCODE_GOAL_INSTALLER="$GITHUB_WORKSPACE/dist/install.js"
          export OPENCODE_GOAL_V2_PLUGIN_URL="file://$GITHUB_WORKSPACE/dist/server.js"
          export OPENCODE2_CURRENT_COMMAND_FIELDS=1 OPENCODE2_NATIVE_REQUIRED=1
          (cd companion-loop && npm ci && node scripts/native-install-pair-test.mjs && node scripts/opencode2-loop-canary.mjs && node scripts/native-cli-host-canary.mjs)
          node scripts/native-status-host-canary.mjs
      - name: Publish stable with npm trusted publishing
        if: steps.release.outputs.publish == 'true'
        run: npm publish --tag latest --access public
      - name: Verify published source, exports, installer and latest tag
        if: steps.release.outputs.verify == 'true'
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs'
          import assert from 'node:assert/strict'
          import { setTimeout as delay } from 'node:timers/promises'
          import { assertRegistrySource } from './scripts/native-release-gate.mjs'
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          const base = 'https://registry.npmjs.org/' + encodeURIComponent(pkg.name)
          let failure
          for (let attempt = 0; attempt < 30; attempt++) {
            try {
              const exact = await fetch(base + '/' + pkg.version, { signal: AbortSignal.timeout(20000) })
              const latest = await fetch(base + '/latest', { signal: AbortSignal.timeout(20000) })
              assert.ok(exact.ok && latest.ok)
              const published = await exact.json()
              assertRegistrySource(published, { name: pkg.name, version: pkg.version, sha: process.env.GITHUB_SHA })
              assert.equal((await latest.json()).version, pkg.version)
              assert.equal(published.bin['opencode-goal'].replace(/^\.\//, ''), 'bin/opencode-goal.js')
              assert.deepEqual(published.exports, pkg.exports)
              assert.deepEqual(published.dependencies, pkg.dependencies)
              console.log('REGISTRY_VERIFIED ' + JSON.stringify({ name: published.name, version: published.version, gitHead: published.gitHead, integrity: published.dist.integrity, latest: pkg.version }))
              failure = undefined
              break
            } catch (error) { failure = error; await delay(10000) }
          }
          if (failure) throw failure
          JS
          VERIFY_DIR="$(mktemp -d)"
          trap 'rm -rf "$VERIFY_DIR"' EXIT
          cd "$VERIFY_DIR"
          for attempt in {1..30}; do
            if test "$(npm exec --yes --package="@bybrawe/opencode-goal@$RELEASE_VERSION" -- opencode-goal --version 2>/dev/null)" = "$RELEASE_VERSION"; then break; fi
            test "$attempt" != 30
            sleep 10
          done
          npm init -y >/dev/null
          for attempt in {1..30}; do
            if npm install --omit=dev --omit=peer --ignore-scripts --no-audit --no-fund "@bybrawe/opencode-goal@$RELEASE_VERSION"; then break; fi
            test "$attempt" != 30
            sleep 10
          done
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          const { default: root, OpenCodeGoalV1Plugin } = await import('@bybrawe/opencode-goal')
          const { default: plugin } = await import('@bybrawe/opencode-goal/server')
          const { default: native } = await import('@bybrawe/opencode-goal/v2')
          const { default: v1 } = await import('@bybrawe/opencode-goal/v1')
          const api = await import('@bybrawe/opencode-goal/api')
          const { GoalStatusRpc } = await import('@bybrawe/opencode-goal/rpc')
          assert.equal(root, plugin)
          assert.equal(plugin.id, '@bybrawe/opencode-goal')
          assert.equal(typeof plugin.setup, 'function')
          assert.equal(typeof plugin.server, 'function')
          assert.equal(plugin.server, v1)
          assert.equal(OpenCodeGoalV1Plugin, v1)
          assert.equal(native.id, '@bybrawe/opencode-goal')
          assert.equal(typeof native.setup, 'function')
          assert.equal('server' in native, false)
          assert.equal(typeof api.createGoal, 'function')
          assert.equal(typeof api.parseGoalCommand, 'function')
          assert.equal(GoalStatusRpc.id, 'opencode-goal-status')
          console.log('PUBLISHED_NATIVE_SERVER_PASS')
          JS
          npm install --omit=dev --ignore-scripts --no-audit --no-fund \
            "@bybrawe/opencode-goal@$RELEASE_VERSION" \
            "@opentui/core@0.5.14" "@opentui/solid@0.5.14" "solid-js@1.9.12"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          const { default: tui } = await import('@bybrawe/opencode-goal/tui')
          assert.equal(tui.id, 'opencode-goal')
          assert.equal(typeof tui.setup, 'function')
          console.log('PUBLISHED_NATIVE_TUI_PASS')
          JS
